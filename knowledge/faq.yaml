# 新手常見問題。答案刻意簡短（Pip 的對話框空間有限）。keys 放同義詞與英文關鍵字，幫助檢索。
- q: '怎麼離開 vim？'
  a: '按 Esc 回到一般模式，輸入 `:wq` 存檔離開，或 `:q!` 放棄修改離開。'
  keys: 'vim 退出 離開 quit 存檔 儲存 wq q! 逃離'
- q: 'nano 怎麼存檔和離開？'
  a: 'Ctrl-O 存檔（再按 Enter 確認），Ctrl-X 離開。底部有快速鍵提示。'
  keys: 'nano 編輯器 儲存 離開 ctrl-o ctrl-x'
- q: '> 和 >> 有什麼差別？'
  a: '`>` 會覆蓋檔案原本的內容，`>>` 是追加在結尾。寫日誌請用 `>>`，不然舊紀錄會消失。'
  keys: '重導向 redirect 覆蓋 追加 append 輸出 寫入檔案'
- q: '管線 | 是什麼？'
  a: '把前一個指令的輸出，直接當成下一個指令的輸入，例如 `ls | wc -l` 數檔案數量。'
  keys: 'pipe 管道 管線 串接 stdin stdout'
- q: '怎麼找檔案？'
  a: '用 `find 目錄 -name 檔名` 依名字找。找內容用 `grep -r 關鍵字 目錄`。'
  keys: 'find 尋找 搜尋 找檔案 locate 找不到'
- q: '怎麼在檔案裡搜尋文字？'
  a: '`grep 關鍵字 檔案`；加 `-r` 遞迴整個目錄、`-i` 不分大小寫、`-n` 顯示行號。'
  keys: 'grep 搜尋 內容 文字 關鍵字 過濾'
- q: 'chmod 755 是什麼意思？'
  a: '三個數字依序是擁有者、群組、其他人。r=4、w=2、x=1，加起來：7=rwx、5=r-x。所以 755 是 rwxr-xr-x。'
  keys: 'chmod 權限 數字 八進位 rwx permission 755 644 600'
- q: '為什麼 Permission denied？'
  a: '權限不足。用 `ls -l` 看權限與擁有者；需要時用 `sudo` 或 `chmod`。'
  keys: 'permission denied 沒有權限 拒絕 被拒絕 權限不足'
- q: 'sudo 是什麼？'
  a: '臨時以 root（管理員）身分執行單一指令。只在需要時用，因為 root 什麼都能做，包括刪光系統。'
  keys: 'sudo root 管理員 提權 su'
- q: 'sudo 和 su 差在哪？'
  a: '`sudo 指令` 只用 root 權限跑一個指令；`su` 是整個切換成另一個使用者，要輸入他的密碼。'
  keys: 'sudo su 切換使用者 差別'
- q: '怎麼回到家目錄？'
  a: '輸入 `cd` 或 `cd ~`。`cd -` 則回到上一個所在的目錄。'
  keys: 'cd 家目錄 home 回家 目錄 切換目錄'
- q: '絕對路徑和相對路徑有什麼不同？'
  a: '絕對路徑從 `/` 開始，在哪都有效；相對路徑從「目前所在目錄」算起，`..` 是上一層。'
  keys: '路徑 絕對 相對 path .. .'
- q: '怎麼刪除資料夾？'
  a: '空的用 `rmdir`，有內容的用 `rm -r 資料夾`。注意 rm 沒有垃圾桶，刪除前先 `ls` 確認。'
  keys: 'rm 刪除 資料夾 目錄 rmdir remove delete'
- q: '怎麼複製資料夾？'
  a: '用 `cp -r 來源 目的`。沒有 `-r` 只能複製單一檔案。'
  keys: 'cp 複製 copy 資料夾 目錄 遞迴'
- q: '怎麼改檔名？'
  a: '用 `mv 舊名 新名`，mv 同時負責搬移和改名。'
  keys: 'mv 改名 重新命名 rename 搬移 移動'
- q: '怎麼看檔案內容？'
  a: '短的用 `cat`，長的用 `less`（空白鍵翻頁、q 離開），只看頭尾用 `head` / `tail`。'
  keys: 'cat less head tail 看內容 讀取 顯示 檔案內容'
- q: '怎麼持續看日誌的最新內容？'
  a: '用 `tail -f 檔案`，新增的內容會即時顯示，按 Ctrl-C 停止。'
  keys: 'tail -f 日誌 log 即時 追蹤 follow'
- q: '怎麼結束一個卡住的程式？'
  a: '前景程式按 Ctrl-C。背景程式用 `kill PID`，不理人的用 `kill -9 PID`。'
  keys: 'kill 結束 中斷 卡住 ctrl-c 殺掉 程序 process'
- q: '怎麼查哪個程序在吃 CPU？'
  a: '`top` 即時看（q 離開），或 `ps aux --sort=-%cpu | head` 看排行榜。'
  keys: 'cpu 吃資源 top ps 效能 負載 記憶體'
- q: '怎麼讓指令在背景執行？'
  a: '指令後面加 `&`。`jobs` 列出背景工作，`fg` 拉回前景；想登出後也不中斷用 `nohup`。'
  keys: '背景 background & jobs fg bg nohup'
- q: '環境變數怎麼設定？'
  a: '`export NAME=值`，之後啟動的程式才看得到。永久生效要寫進 `~/.bashrc`。'
  keys: 'export 環境變數 variable env PATH bashrc'
- q: 'PATH 是什麼？'
  a: '一串用冒號隔開的目錄，shell 依序在裡面找指令。新增用 `export PATH=$PATH:新目錄`。'
  keys: 'path 環境變數 找不到指令 command not found'
- q: 'command not found 是什麼意思？'
  a: '找不到這個指令。檢查拼字；用 `which 指令` 確認它存在；善用 Tab 補全避免打錯。'
  keys: 'command not found 找不到指令 未找到 拼字'
- q: 'No such file or directory 是什麼意思？'
  a: '路徑不存在。用 `pwd` 確認所在位置、`ls` 確認檔名，注意大小寫也要一致。'
  keys: 'no such file 找不到檔案 路徑錯誤 不存在'
- q: '怎麼壓縮與解壓縮？'
  a: '打包壓縮 `tar -czf 檔.tar.gz 目錄`；解開 `tar -xzf 檔.tar.gz`；zip 用 `zip -r` 與 `unzip`。'
  keys: 'tar zip 壓縮 解壓縮 打包 gz unzip 備份'
- q: '怎麼寫 shell 腳本？'
  a: '第一行寫 `#!/bin/bash`，存檔後 `chmod +x 檔名`，用 `./檔名` 執行。'
  keys: 'script 腳本 shell bash shebang 執行腳本'
- q: '$1 和 $@ 是什麼？'
  a: '`$1` 是第一個參數、`$#` 是參數個數、`"$@"` 是全部參數（每個保持獨立，記得加雙引號）。'
  keys: '參數 argument $1 $@ $# 位置參數'
- q: '怎麼看網路位址和連接埠？'
  a: '`ip addr` 看位址，`ss -tln` 看正在監聽的 TCP 連接埠。'
  keys: 'ip ss 網路 位址 連接埠 port 監聽 netstat'
- q: '怎麼測試網路通不通？'
  a: '`ping -c 3 目標` 測連通，`curl -I 網址` 看網站回應，`nc -zv 主機 埠` 測連接埠。'
  keys: 'ping curl 網路 連線 測試 通不通 nc'
- q: '怎麼下載檔案？'
  a: '`curl -O 網址` 或 `wget 網址`。`curl -o 檔名 網址` 可以指定存成的檔名。'
  keys: 'curl wget 下載 download'
- q: 'ssh 怎麼連線？'
  a: '`ssh 使用者@主機`；指定埠用 `-p`。用金鑰比密碼安全：`ssh-keygen -t ed25519` 產生金鑰。'
  keys: 'ssh 遠端 登入 金鑰 連線 scp'
- q: 'git 怎麼提交？'
  a: '`git add 檔案` 放進暫存區，再 `git commit -m "訊息"`。用 `git status` 隨時確認狀態。'
  keys: 'git commit add 提交 版本控制 暫存'
- q: 'git 衝突怎麼解決？'
  a: '編輯有 <<<<<<< 標記的檔案，改成最終內容並刪掉標記，再 `git add` 與 `git commit`。'
  keys: 'git conflict 衝突 merge 合併 解決'
- q: '怎麼用 sed 取代文字？'
  a: '`sed ''s/舊/新/g'' 檔案`；加 `-i` 直接修改檔案本身（修改前最好先備份）。'
  keys: 'sed 取代 替換 substitute 文字處理'
- q: 'awk 可以做什麼？'
  a: '依欄位處理文字，例如 `awk ''{print $1}''` 印第一欄，`awk ''{s+=$3} END{print s}''` 加總第三欄。'
  keys: 'awk 欄位 加總 統計 文字處理'
- q: '怎麼排序和去重？'
  a: '`sort` 排序（`-n` 數字、`-r` 反向），`uniq` 去重（要先 sort），`sort | uniq -c | sort -nr` 是排行榜三連招。'
  keys: 'sort uniq 排序 去重 統計 排行 次數'
- q: '怎麼看磁碟空間？'
  a: '`df -h` 看各磁碟剩餘，`du -sh 目錄` 看某目錄大小，`du -sh *` 找出誰最大。'
  keys: 'df du 磁碟 空間 容量 disk 滿了'
- q: '萬用字元 * 和 ? 是什麼？'
  a: '`*` 代表任意多個字元，`?` 代表剛好一個，`[abc]` 代表其中之一。例如 `rm *.log`。'
  keys: 'wildcard 萬用字元 glob * ? 通配'
- q: '引號有什麼差別？'
  a: '單引號內容原樣保留；雙引號內 `$變數` 仍會展開；檔名有空白一定要加引號。'
  keys: '引號 quote 單引號 雙引號 空白 空格'
- q: '怎麼讓指令定時執行？'
  a: '用 cron：`crontab -e` 編輯，格式「分 時 日 月 星期 指令」。只執行一次用 `at`。'
  keys: 'cron crontab 排程 定時 schedule at'
- q: '怎麼管理服務？'
  a: '`systemctl start|stop|status 服務名`，看日誌用 `journalctl -u 服務名`。（本遊戲裡是模擬版）'
  keys: 'systemctl 服務 service journalctl 啟動 停止 日誌'
- q: '怎麼新增使用者？'
  a: '`sudo useradd -m 名字` 建立並建家目錄；加入群組 `sudo usermod -aG 群組 名字`（-a 不能漏）。'
  keys: 'useradd 使用者 帳號 user 群組 usermod'
- q: '怎麼查我是誰、在哪？'
  a: '`whoami` 看使用者，`pwd` 看目前目錄，`hostname` 看主機名稱，`id` 看 uid 與群組。'
  keys: 'whoami pwd hostname id 我是誰 在哪裡'
- q: '說明書怎麼看？'
  a: '`man 指令` 看完整說明（/ 搜尋、q 離開），`指令 --help` 看簡短說明。'
  keys: 'man help 說明 手冊 文件 用法'
- q: 'tmux 是什麼？'
  a: '終端機多工器。工作階段在背景持續執行，斷線也不會中斷。`tmux new -s 名字` 建立，`tmux attach -t 名字` 回來。'
  keys: 'tmux 多工 session 工作階段 斷線'
- q: 'Linux 和 Unix 是什麼關係？'
  a: 'Linux 是類 Unix 的作業系統核心，指令與觀念大多沿用 Unix 的設計：「一個工具做好一件事，用管線組合」。'
  keys: 'linux unix 作業系統 核心 kernel 是什麼'
- q: 'root 是什麼？'
  a: '系統的超級管理員（uid 0），什麼都能做。平常用一般使用者，需要時才用 `sudo`。'
  keys: 'root 超級使用者 管理員 uid'
- q: '怎麼清空畫面？'
  a: '輸入 `clear` 或按 Ctrl-L。在這個遊戲裡，Ctrl-L 與 `clear` 會清空輸出區。'
  keys: 'clear 清除 清空畫面 清屏'
- q: '怎麼查看歷史指令？'
  a: '按 ↑ 叫回上一個指令；`history` 列出全部；在這個輸入框也可以用 ↑↓ 翻歷史。'
  keys: 'history 歷史 上一個指令 重複'
