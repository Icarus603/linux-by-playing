name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
env:
  IMAGE: ghcr.io/icarus603/linux-by-playing
jobs:
  build:
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - run: |
          mkdir -p /tmp/digests && touch "/tmp/digests/$(echo '${{ steps.build.outputs.digest }}' | sed 's/sha256://')"
      - uses: actions/upload-artifact@v4
        with: { name: 'digests-${{ strategy.job-index }}', path: /tmp/digests/*, if-no-files-found: error }
  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: /tmp/digests, pattern: 'digests-*', merge-multiple: true }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          TAG="${GITHUB_REF_NAME:-latest}"
          docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:$TAG" $(printf "$IMAGE@sha256:%s " *)
      - uses: actions/checkout@v4
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            install.sh
            scripts/play
