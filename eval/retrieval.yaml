- q: iptables 怎麼開放某個埠
  expect: iptables/nft
- q: ffmpeg 怎麼轉檔成 mp3
  expect: ffmpeg
- q: git 怎麼撤銷上一次 commit
  expect: git reset
- q: docker 容器怎麼進去執行指令
  expect: docker exec
- q: curl 怎麼送 POST JSON
  expect: curl
- q: tar 怎麼解壓到指定目錄
  expect: tar
- q: 透明大頁要不要關
  expect: hugepage/大頁
