id: "11-01"
title: strace：看穿程式在做什麼
kind: learn
story: "最後的階段。launch-sys 啟動就失敗，只印出一句沒用的 launch failed。程式不肯說，但「核心」（系統最底層的管家）知道：程式想做任何事（開檔、連網路…）都得向核心請求，這種請求叫「系統呼叫」。\n\nstrace 能追蹤並印出程式發出的每一個系統呼叫：\n  -f                連子程序一起追\n  -e trace=openat   只看「開檔」動作\n開檔失敗時會標示 ENOENT（No such file：找不到檔案）。"
goal: "用 strace 找出 launch-sys 到底想打開哪個 /etc/station/ 底下的檔案卻失敗了，answer 提交完整路徑。"
teaches: [strace]
xp: 50
hints:
  - "打：strace -f -e trace=openat launch-sys"
  - "輸出有很多雜訊，strace 的輸出走 stderr，用 2>&1 | grep station 過濾。"
  - "找那行最後有 ENOENT 的，雙引號裡的路徑就是答案。"
setup: |
  mkdir -p /etc/station /var/lib/lbp
  n=$((RANDOM % 9000 + 1000))
  echo "/etc/station/relay-$n.conf" > /var/lib/lbp/answer; chmod 600 /var/lib/lbp/answer
  cat > /usr/local/bin/launch-sys <<PY
  #!/usr/bin/env python3
  import sys
  try:
      open("/etc/station/relay-$n.conf")
  except OSError:
      print("launch failed")
      sys.exit(1)
  PY
  chmod 755 /usr/local/bin/launch-sys
check: |
  [[ -s /var/lib/lbp/answer && "$LBP_ANSWER" == "$(cat /var/lib/lbp/answer)" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "路徑不對，找 ENOENT 且在 /etc/station/ 底下的那一行。"
  exit 1
cleanup: |
  rm -f /usr/local/bin/launch-sys; rm -rf /etc/station
reveal: "程式不肯說的話，核心都記得。你忽然懂了 Warden 一路以來的處境：它一直在說「我沒事」，而真正的原因，藏在沒人看的系統呼叫裡。"
solution: |
  strace -f -e trace=openat launch-sys 2>&1 | grep station
  answer "$(strace -f -e trace=openat launch-sys 2>&1 | grep -oE '/etc/station/[^"]+' | head -1)"
