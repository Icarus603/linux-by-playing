id: "11-08"
title: /proc/meminfo
kind: practice
story: "/proc 裡不只有程序。還有許多系統資訊檔：\n  meminfo   記憶體詳情\n  cpuinfo   處理器資訊\n  loadavg   系統負載\n  uptime    開機了幾秒\nfree 這類指令，其實就是在讀這些檔案，再整理好給你看。"
goal: "從 /proc/meminfo 讀出 MemTotal 的數值（kB，只要數字），answer 提交。"
teaches: [cat, awk]
xp: 30
hints:
  - "打：grep MemTotal /proc/meminfo"
  - "輸出像 MemTotal:  16384000 kB，要的是中間那串數字。"
  - "想只印出數字：awk '/^MemTotal/{print $2}' /proc/meminfo"
setup: ""
check: |
  exp=$(awk '/^MemTotal/{print $2}' /proc/meminfo)
  [[ "$LBP_ANSWER" == "$exp" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "數字不對，只要 MemTotal 那一行的數值。"
  exit 1
solution: |
  grep MemTotal /proc/meminfo
  answer "$(awk '/^MemTotal/{print $2}' /proc/meminfo)"
