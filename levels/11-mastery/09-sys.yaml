id: "11-09"
title: /sys：裝置與核心參數
kind: practice
story: "/sys 跟 /proc 很像，但專門以檔案樹的形式呈現核心的「裝置模型」：\n  /sys/class/net/   各個網路介面\n  /sys/block/       各個磁碟\n每個裝置的屬性都是一個小檔案，讀它就得到硬體資訊；寫它（需要 root）甚至能直接調整裝置。\nMTU 是網路介面一次能傳送的封包最大大小。"
goal: "讀取 /sys/class/net/lo/mtu，answer 提交 lo 介面的 MTU 數值。"
teaches: [cat]
xp: 30
hints:
  - "它就是一個小檔案，用 cat 讀。"
  - "打：cat /sys/class/net/lo/mtu"
  - "answer 印出的那個數字。"
setup: ""
check: |
  exp=$(cat /sys/class/net/lo/mtu)
  [[ "$LBP_ANSWER" == "$exp" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "數字不對。"
  exit 1
solution: |
  cat /sys/class/net/lo/mtu
  answer "$(cat /sys/class/net/lo/mtu)"
