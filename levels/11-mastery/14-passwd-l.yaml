id: "11-14"
title: 鎖定帳號
kind: practice
story: "發現可疑帳號時，先「鎖住」它，而不是急著刪除，因為刪了就沒有證據可查。\n  passwd -S 帳號   查看帳號狀態（L = 已鎖定、P = 有密碼可用）\n  passwd -l 帳號   鎖定（l = lock）：讓這個帳號無法用密碼登入\n這些都需要 root，要加 sudo。"
goal: "使用者 mallory 的行為可疑。把他的帳號鎖定（不要刪除）。"
teaches: [passwd]
xp: 40
hints:
  - "先看目前狀態：sudo passwd -S mallory（P 表示可正常登入）。"
  - "鎖定：sudo passwd -l mallory"
  - "再看一次 sudo passwd -S mallory，狀態應該變成 L。"
setup: |
  id mallory >/dev/null 2>&1 || useradd -m -s /bin/bash mallory
  echo 'mallory:Secret123' | chpasswd
check: |
  [[ "$(passwd -S mallory 2>/dev/null | awk '{print $2}')" == "L" ]] && id mallory >/dev/null 2>&1
cleanup: |
  userdel -r mallory 2>/dev/null || true
solution: |
  sudo passwd -l mallory
