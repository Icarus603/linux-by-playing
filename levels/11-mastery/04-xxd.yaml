id: "11-04"
title: xxd：十六進位檢視
kind: practice
story: "電腦底層存的是 0 和 1，用「十六進位」（0-9 加 a-f，每兩位代表一個位元組）來讀比較方便。xxd 把檔案顯示成「十六進位 + 對照的文字」。\n\n很多檔案類型開頭的幾個位元組是固定的「魔術數字」，像身分證：只要看開頭，就知道它真正是什麼格式（PNG、ZIP…）。\n  xxd -l 4 檔案      只看開頭 4 個位元組（-l = length）\n  xxd -l 4 -p 檔案   -p 輸出連續的純十六進位，不含空格"
goal: "magic.bin 開頭 4 個位元組是這個檔案的識別碼。用 xxd 讀出來，answer 提交（8 個小寫十六進位字元，不含空格）。"
teaches: [xxd, hexdump]
xp: 40
hints:
  - "打：xxd -l 4 magic.bin，看開頭 4 個位元組。"
  - "想直接得到連續的字串：xxd -l 4 -p magic.bin"
  - "answer 那 8 個字元（小寫、不要空格）。"
setup: |
  cd /home/player
  h=$(openssl rand -hex 4)
  { echo "$h" | xxd -r -p; head -c 100 /dev/urandom; } > magic.bin
  mkdir -p /var/lib/lbp && echo "$h" > /var/lib/lbp/answer && chmod 600 /var/lib/lbp/answer
check: |
  [[ -s /var/lib/lbp/answer && "${LBP_ANSWER,,}" == "$(cat /var/lib/lbp/answer)" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "不對，要前 4 個位元組，共 8 個十六進位字元。"
  exit 1
solution: |
  xxd -l 4 -p magic.bin
  answer "$(xxd -l 4 -p magic.bin)"
