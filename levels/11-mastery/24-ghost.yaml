id: "11-24"
title: "隱藏終章：Vega 的錄音"
kind: boss
cwd: /var/lib/ghost
story: "站上燈全亮了。Pip 卻注意到 /var/lib/ghost 這個目錄：裡面有 11 份你一路都沒讀過的日誌，是 Vega 失蹤前後以 ghost 帳號留下的。每份最後一行都有一個單字。把它們依序拼起來，就是他想說的話。這一關是隱藏的，不想做可以直接 /skip。"
goal: "讀出 /var/lib/ghost 裡 11 份日誌的 fragment 單字，依檔案順序用空白串成一句話，用 answer 提交（例如 answer WORD1 WORD2 ...）。"
teaches: [cat, grep, sed, tr, answer]
xp: 200
hints:
  - "ls /var/lib/ghost 看有哪些檔案，cat 一份來看格式。"
  - "每份都有一行「fragment NN: 單字」。grep -h '^fragment' /var/lib/ghost/*.log 一次撈出來。"
  - "用 sed 's/.*: //' 去掉前綴，再 tr '\\n' ' ' 把換行換成空白，最後去掉結尾空白。"
setup: |
  mkdir -p /var/lib/ghost
check: |
  [[ "${LBP_ANSWER^^}" == "I FORGOT TO TURN OFF THE CLEANUP SCHEDULE BUT WARDEN STAYED" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "句子不對。確認 11 個單字都在，而且依檔案編號排序。"
  exit 1
reveal: "那句話是：「我忘了關掉清理排程，但 Warden 留了下來。」Vega 從一開始就知道誰才該被責怪。他沒有躲你，他只是不敢面對自己的疏忽。Pip 輕輕說：「我一直在等你問我『你是誰』。我是第一個陪在終端機裡的人，後來是你，讓這座站有了值班員。」"
solution: |
  answer "$(grep -h '^fragment' /var/lib/ghost/*.log | sed 's/.*: //' | tr '\n' ' ' | sed 's/ $//')"
