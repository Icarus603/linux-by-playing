id: "7-07"
title: zip：跨平台壓縮
kind: practice
story: "要把檔案寄給用 Windows 或 Mac 的人？tar.gz 他們不一定會開，zip 則人人都開得了。\n  zip 壓縮檔名.zip 檔案1 檔案2 ...\n  zip -r 壓縮檔名.zip 目錄    -r 會連目錄和它裡面的內容一起放進去"
goal: "把 a.txt、b.txt 與 photos 目錄（含內容）壓成 bundle.zip。"
teaches: [zip]
xp: 20
hints:
  - "有目錄要包含，所以要加 -r。"
  - "格式：zip -r 壓縮檔名.zip 項目1 項目2 項目3"
  - "打：zip -r bundle.zip a.txt b.txt photos"
setup: |
  cd /home/player
  echo a > a.txt; echo b > b.txt
  mkdir -p photos; echo img > photos/p1.jpg
check: |
  cd /home/player
  [[ -f bundle.zip ]] || { echo '還沒有 bundle.zip。'; exit 1; }
  unzip -l bundle.zip | grep -q 'a.txt' || { echo 'bundle.zip 裡沒有 a.txt。'; exit 1; }
  unzip -l bundle.zip | grep -q 'b.txt' || { echo 'bundle.zip 裡沒有 b.txt。'; exit 1; }
  unzip -l bundle.zip | grep -q 'photos/p1.jpg' || { echo 'bundle.zip 裡沒有 photos/p1.jpg，目錄要加 -r。'; exit 1; }
solution: |
  zip -r bundle.zip a.txt b.txt photos
