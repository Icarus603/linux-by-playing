id: "7-15"
title: 讀懂排程
kind: practice
story: "讀懂別人寫的排程，是維運的基本功。五個欄位的範圍：\n  分 (0-59)　時 (0-23)　日 (1-31)　月 (1-12)　星期 (0-7，1 到 5 是週一到週五)\n  *       每一個\n  */15    每隔 15（例如每 15 分鐘）\n  1-5     1 到 5（連續範圍）\n例如 0 9 * * 1-5 就是「週一到週五，每天早上 9:00」。"
goal: "jobs.cron 裡有四筆排程。找出「每個平日（週一到週五）早上 9:00 執行」的是哪個腳本，answer 提交檔名（例如 foo.sh）。"
teaches: [cron, cat]
xp: 25
hints:
  - "先看內容：cat jobs.cron"
  - "要找：分=0、時=9、星期欄=1-5 的那一行。"
  - "answer 那一行最後面的腳本檔名。"
setup: |
  cd /home/player
  cat > jobs.cron <<'CRON'
  0 9 * * 1-5 /opt/jobs/report.sh
  30 2 * * 0 /opt/jobs/weekly-clean.sh
  */15 * * * * /opt/jobs/heartbeat.sh
  0 0 1 * * /opt/jobs/monthly-invoice.sh
  CRON
check: |
  [[ "$LBP_ANSWER" == "report.sh" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "不對，注意分、時、星期三個欄位。"
  exit 1
solution: |
  cat jobs.cron
  answer report.sh
