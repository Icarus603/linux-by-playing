id: "7-05"
title: gzip 與 gunzip
kind: practice
story: "不用打包、只想壓縮單一檔案，可以直接用 gzip：\n  gzip 檔案        壓縮，原檔會被換成 檔案.gz\n  gunzip 檔案.gz   還原（解壓縮）\n壓縮日誌檔可以省下大量空間。"
goal: "notes.txt.gz 是壓縮過的筆記。把它還原成 notes.txt。"
teaches: [gunzip, gzip]
xp: 15
hints:
  - "還原用 gunzip（g 加 unzip）。"
  - "格式：gunzip 檔案.gz"
  - "打：gunzip notes.txt.gz，再用 ls 確認 notes.txt 出現。"
setup: |
  cd /home/player
  echo "mission notes" > notes.txt
  gzip -f notes.txt
check: |
  cd /home/player
  [[ -f notes.txt && ! -e notes.txt.gz && "$(cat notes.txt)" == "mission notes" ]]
solution: |
  gunzip notes.txt.gz
