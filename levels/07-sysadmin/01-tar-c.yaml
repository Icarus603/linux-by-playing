id: "7-01"
title: tar：打包
kind: learn
story: "要備份一整個資料夾時，一個個檔案傳很麻煩。tar 能把許多檔案和目錄「打包」成一個檔案（像把東西裝進一個箱子，只是打包，還沒變小）。\n  tar -cf 箱子檔名 要打包的東西\n選項：c 是 create（建立）、f 是 file（指定檔名，f 後面一定要馬上接檔名）；想看過程再加 v（verbose）。"
goal: "把 docs 目錄打包成 archive.tar。"
teaches: [tar]
xp: 20
hints:
  - "格式：tar -cf 打包後的檔名 要打包的目錄"
  - "打：tar -cf archive.tar docs"
  - "用 ls 確認 archive.tar 出現了。"
setup: |
  cd /home/player
  mkdir -p docs/sub
  echo a > docs/a.txt; echo b > docs/sub/b.txt
check: |
  cd /home/player
  [[ -f archive.tar ]] || { echo '還沒有 archive.tar。'; exit 1; }
  tar -tf archive.tar | grep -q 'docs/a.txt' || { echo 'archive.tar 裡沒有 docs/a.txt。'; exit 1; }
  tar -tf archive.tar | grep -q 'docs/sub/b.txt' || { echo 'archive.tar 裡沒有 docs/sub/b.txt，要包含子目錄。'; exit 1; }
solution: |
  tar -cf archive.tar docs
