id: "7-21"
title: 磁碟與掛載
kind: practice
story: "df -h 看各檔案系統的使用量，加 -T 還會顯示類型。mount 列出所有掛載點。想知道「這個目錄放在哪個磁碟、什麼格式」就靠它們。"
goal: "用 df -T 查出根目錄 / 的檔案系統類型，answer 提交。"
teaches: [df, mount, lsblk]
xp: 20
hints:
  - "df -T /"
  - "第二欄是 Type。"
setup: ""
check: |
  exp=$(df -T / | awk 'NR==2{print $2}')
  [[ "$LBP_ANSWER" == "$exp" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "不對，看 df -T 輸出的 Type 欄。"
  exit 1
solution: |
  df -T /
  answer "$(df -T / | awk 'NR==2{print $2}')"
