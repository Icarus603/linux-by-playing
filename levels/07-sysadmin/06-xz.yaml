id: "7-06"
title: xz 與 bzip2
kind: practice
story: "壓縮工具有取捨：gzip 快、bzip2 與 xz 壓得更小但更慢。xz 通常壓得最小，適合長期封存。"
goal: "把 biglog.txt 用 xz 壓縮，產生 biglog.txt.xz。"
teaches: [xz, bzip2]
xp: 20
hints:
  - "xz biglog.txt"
  - "解壓縮是 unxz 或 xz -d。bzip2 的用法一模一樣。"
setup: |
  cd /home/player
  for i in $(seq 1 2000); do echo "log line $i: all systems nominal"; done > biglog.txt
check: |
  cd /home/player
  [[ -f biglog.txt.xz && ! -e biglog.txt ]] && xz -t biglog.txt.xz
solution: |
  xz biglog.txt
