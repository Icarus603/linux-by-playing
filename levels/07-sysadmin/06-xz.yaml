id: "7-06"
title: xz 與 bzip2
kind: practice
story: "壓縮工具有取捨：\n  gzip   最快，壓縮率普通\n  bzip2  更小，較慢\n  xz     通常壓得最小，最慢，適合長期封存\n用法都差不多：xz 檔案 壓縮，xz -d 檔案.xz（或 unxz）解壓縮。"
goal: "把 biglog.txt 用 xz 壓縮，產生 biglog.txt.xz。"
teaches: [xz, bzip2]
xp: 20
hints:
  - "格式：xz 檔案名"
  - "打：xz biglog.txt"
  - "用 ls 確認出現 biglog.txt.xz（原檔會被換掉）。"
setup: |
  cd /home/player
  for i in $(seq 1 2000); do echo "log line $i: all systems nominal"; done > biglog.txt
check: |
  cd /home/player
  [[ -f biglog.txt.xz ]] || { echo '還沒有 biglog.txt.xz。'; exit 1; }
  [[ ! -e biglog.txt ]] || { echo 'biglog.txt 還在，壓縮後原檔應該被取代。'; exit 1; }
  xz -t biglog.txt.xz || { echo 'biglog.txt.xz 不是完整的 xz 檔。'; exit 1; }
solution: |
  xz biglog.txt
