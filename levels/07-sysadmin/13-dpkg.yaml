id: "7-13"
title: dpkg：這個程式來自哪個套件
kind: practice
story: "Debian 系的系統用套件管理程式：dpkg 管理本機套件，apt 負責從網路下載安裝（這個學習容器沒有對外網路，所以只練習查詢）。dpkg -S 路徑 能告訴你「這個檔案屬於哪個套件」。"
goal: "用 dpkg -S 找出 /usr/bin/ssh 屬於哪個套件，answer 提交套件名稱。"
teaches: [dpkg, apt]
xp: 25
hints:
  - "dpkg -S /usr/bin/ssh"
  - "冒號前面就是套件名稱。"
setup: ""
check: |
  exp=$(dpkg -S /usr/bin/ssh 2>/dev/null | head -1 | cut -d: -f1)
  [[ "$LBP_ANSWER" == "$exp" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "不對，只要冒號前面的套件名。"
  exit 1
solution: |
  dpkg -S /usr/bin/ssh
  answer openssh-client
