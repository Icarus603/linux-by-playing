id: "7-09"
title: 環境變數與 export
kind: practice
story: "「環境變數」是一組放在 shell 裡的「名字=值」設定，程式可以讀它來決定怎麼運作（像是一張貼在牆上的便條）。\n  VAR=值             只在目前這個 shell 裡有效，之後啟動的程式看不到（這是新手最常踩的坑）\n  export VAR=值      才會把變數「交給」你之後啟動的程式\n  VAR=值 指令        只對這一次指令有效\n  printenv VAR       看變數有沒有被設定"
goal: "report.sh 會把環境變數 MISSION 寫進 report.out。請讓報告內容是 mission=apollo，然後執行 ./report.sh。"
teaches: [export, env, printenv]
xp: 25
hints:
  - "最簡單：把變數寫在指令前面，只對這一次有效：MISSION=apollo ./report.sh"
  - "或者先 export MISSION=apollo，再執行 ./report.sh。"
  - "可以用 printenv MISSION 確認變數；再 cat report.out 看結果。"
setup: |
  cd /home/player
  printf '#!/bin/bash\necho "mission=$MISSION" > /home/player/report.out\n' > report.sh
  chmod 755 report.sh
check: |
  [[ "$(cat /home/player/report.out 2>/dev/null)" == "mission=apollo" ]]
solution: |
  export MISSION=apollo
  ./report.sh
