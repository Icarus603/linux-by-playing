id: "7-02"
title: tar 加上壓縮
kind: practice
story: "打包之後通常還會「壓縮」讓檔案變小。tar 加一個 z 就會順便用 gzip 壓縮，慣例副檔名是 .tar.gz（或 .tgz）。\n  tar -czf 檔名.tar.gz 要打包的東西\n口訣：c 建立、z 壓縮、f 檔名。"
goal: "把 data 目錄打包並用 gzip 壓縮，存成 backup.tar.gz。"
teaches: [tar, gzip]
xp: 20
hints:
  - "比上一關多一個 z（壓縮）。"
  - "格式：tar -czf 檔名.tar.gz 目錄"
  - "打：tar -czf backup.tar.gz data"
setup: |
  cd /home/player
  mkdir -p data
  echo records > data/db.txt
check: |
  cd /home/player
  [[ -f backup.tar.gz ]] || { echo '還沒有 backup.tar.gz。'; exit 1; }
  file backup.tar.gz | grep -qi gzip || { echo 'backup.tar.gz 不是 gzip 壓縮檔，建立時要加壓縮選項。'; exit 1; }
  tar -tzf backup.tar.gz | grep -q 'data/db.txt' || { echo 'backup.tar.gz 裡沒有 data/db.txt。'; exit 1; }
solution: |
  tar -czf backup.tar.gz data
