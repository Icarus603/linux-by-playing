id: "8-05"
title: if 與檔案測試
kind: practice
story: "if 讓腳本能「做決定」：\n  if [ 條件 ]; then\n    ...\n  elif [ 另一個條件 ]; then\n    ...\n  else\n    ...\n  fi\n（fi 是 if 倒過來寫，代表結束。）\n常用的「檔案測試」條件：\n  -f 路徑   是一般檔案\n  -d 路徑   是目錄\n  -e 路徑   存在（不管是什麼）"
goal: "寫 probe.sh PATH：路徑是檔案就印 file、是目錄就印 dir、不存在就印 missing。"
teaches: [test, bash]
xp: 30
hints:
  - "路徑是第 1 個參數 $1，條件寫成 [ -f \"$1\" ]（雙引號保護含空格的路徑）。"
  - "骨架：if [ -f \"$1\" ]; then echo file; elif [ -d \"$1\" ]; then echo dir; else echo missing; fi"
  - "測試：./probe.sh /etc（dir）、./probe.sh /etc/passwd（file）、./probe.sh /nope（missing）。"
setup: ""
check: |
  P() { runuser -u player -- bash -c "cd /home/player && $1" 2>&1; }
  [[ -f /home/player/probe.sh ]] || { echo "還沒有 probe.sh。"; exit 1; }
  [[ "$(P 'bash probe.sh /etc/hostname')" == file && "$(P 'bash probe.sh /etc')" == dir && "$(P 'bash probe.sh /no/such/path')" == missing ]]
solution: |
  cat > probe.sh <<'EOS'
  #!/bin/bash
  if [ -f "$1" ]; then echo file
  elif [ -d "$1" ]; then echo dir
  else echo missing
  fi
  EOS
