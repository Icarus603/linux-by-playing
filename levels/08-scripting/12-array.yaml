id: "8-12"
title: 陣列
kind: practice
story: "bash 有「陣列」，能把好幾個值放在同一個變數裡：\n  arr=(a b c)         建立\n  ${arr[0]}           取第 0 個（從 0 開始數！）\n  ${arr[@]}           全部元素\n  ${#arr[@]}          元素個數\n  arr=(\"$@\")           把所有參數放進陣列\n要從尾巴往前跑，可以用 C 風格的迴圈：for ((i=n-1; i>=0; i--)); do ... done。"
goal: "寫 rev.sh：把收到的參數反過來印在同一行，用空白分隔。例如 ./rev.sh one two three 印 three two one。"
teaches: [declare, bash]
xp: 35
hints:
  - "先把參數放進陣列：arr=(\"$@\")，再用 ${#arr[@]} 取得個數。"
  - "從最後一個索引往前：for ((i=${#arr[@]}-1; i>=0; i--)); do ...; done"
  - "同一行輸出可以用 echo -n \"${arr[i]} \"，最後再 echo 換行；或把結果累積到一個字串變數再 echo。"
setup: ""
check: |
  P() { runuser -u player -- bash -c "cd /home/player && $1" 2>&1; }
  [[ -f /home/player/rev.sh ]] || { echo "還沒有 rev.sh。"; exit 1; }
  [[ "$(P 'bash rev.sh one two three')" == "three two one" && "$(P 'bash rev.sh solo')" == "solo" ]]
solution: |
  cat > rev.sh <<'EOS'
  #!/bin/bash
  arr=("$@")
  out=()
  for ((i=${#arr[@]}-1; i>=0; i--)); do out+=("${arr[i]}"); done
  echo "${out[*]}"
  EOS
