id: "8-21"
title: printf 排版
kind: practice
story: "printf 比 echo 更精確，能控制排版（做報表必備）。語法：printf '格式' 資料…\n  %s  字串　　%d  整數\n  %-8s  字串、靠左對齊、佔 8 格寬\n  %5d    整數、靠右對齊、佔 5 格寬\n  \\n     換行（printf 不會自動換行，要自己加）\n例如 printf '%-8s|%5d\\n' fuel 10 會印出 fuel    |   10。"
goal: "items.txt 每行是「品名 數量」。寫 table.sh：每行輸出成「品名靠左寬度 8、一條直線 |、數量靠右寬度 5」的格式，例如 fuel    |   10。"
teaches: [printf, read, bash]
xp: 45
hints:
  - "逐行讀入並拆成兩個變數：while read -r name qty; do ...; done < items.txt"
  - "格式字串：'%-8s|%5d\\n'（結尾要有 \\n 換行）。"
  - "完整：while read -r name qty; do printf '%-8s|%5d\\n' \"$name\" \"$qty\"; done < items.txt"
setup: |
  printf 'fuel 10\nfood 200\nparts 7\n' > /home/player/items.txt
check: |
  P() { runuser -u player -- bash -c "cd /home/player && $1" 2>&1; }
  [[ -f /home/player/table.sh ]] || { echo "還沒有 table.sh。"; exit 1; }
  exp=$(while read -r a b; do printf '%-8s|%5d\n' "$a" "$b"; done < /home/player/items.txt)
  [[ "$(P 'bash table.sh')" == "$exp" ]]
solution: |
  cat > table.sh <<'EOS'
  #!/bin/bash
  while read -r name qty; do
    printf '%-8s|%5d\n' "$name" "$qty"
  done < items.txt
  EOS
