id: "8-02"
title: 變數與指令替換
kind: learn
story: "變數用 NAME=值（等號兩邊不能有空格），用 $NAME 取值。$(指令) 會執行指令並把輸出換進來，這叫指令替換。"
goal: "crew/ 目錄裡有若干檔案。寫 crew-count.sh，把檔案數量存進變數，印出 Crew: 數量（例如 Crew: 7）。"
teaches: [echo, ls, wc]
xp: 25
hints:
  - "n=$(ls crew | wc -l)"
  - "echo \"Crew: $n\""
setup: |
  cd /home/player
  rm -rf crew; mkdir crew
  for i in $(seq 1 $((RANDOM % 9 + 3))); do touch crew/member-$i; done
check: |
  P() { runuser -u player -- bash -c "cd /home/player && $1" 2>&1; }
  [[ -f /home/player/crew-count.sh ]] || { echo "還沒有 crew-count.sh。"; exit 1; }
  exp="Crew: $(ls /home/player/crew | wc -l)"
  [[ "$(P 'bash crew-count.sh')" == "$exp" ]]
solution: |
  cat > crew-count.sh <<'EOS'
  #!/bin/bash
  n=$(ls crew | wc -l)
  echo "Crew: $n"
  EOS
