id: "8-22"
title: shellcheck：讓機器幫你挑錯
kind: practice
story: "shellcheck 是 shell 腳本的靜態分析器，會指出沒加引號的變數、危險的寫法、可攜性問題。寫腳本的人都該把它當成第二雙眼睛。"
goal: "bad.sh 有幾個典型壞習慣。修好它，讓 shellcheck bad.sh 沒有任何警告，同時功能不變：仍然會印出目前目錄中每個 .txt 檔的名稱。"
teaches: [shellcheck]
xp: 55
hints:
  - "先執行 shellcheck bad.sh，看每個警告的編號與說明。"
  - "for f in $(ls *.txt) 是經典錯誤，改成 for f in *.txt。"
  - "變數展開記得加雙引號：\"$f\"。"
setup: |
  cd /home/player
  cat > bad.sh <<'EOS'
  #!/bin/bash
  for f in $(ls *.txt); do
    echo $f
  done
  file=$1
  rm $file.tmp
  EOS
check: |
  P() { runuser -u player -- bash -c "cd /home/player && $1" 2>&1; }
  cd /home/player
  shellcheck bad.sh >/dev/null 2>&1 || { echo "shellcheck 還有警告。"; exit 1; }
  out=$(P 'd=$(mktemp -d); touch "$d/a.txt" "$d/b b.txt"; cp bad.sh "$d/"; cd "$d" && bash bad.sh 2>/dev/null; rm -rf "$d"')
  [[ "$out" == $'a.txt\nb b.txt' ]] || { echo "功能不能變：要印出每個 .txt 檔名（含空白的檔名也要完整）。"; exit 1; }
solution: |
  cat > bad.sh <<'EOS'
  #!/bin/bash
  for f in *.txt; do
    echo "$f"
  done
  file=$1
  rm -- "$file.tmp"
  EOS
