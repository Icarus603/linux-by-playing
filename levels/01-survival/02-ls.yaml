id: "1-02"
title: 看看四周
kind: learn
story: "知道自己在哪之後，要看看四周有什麼。ls 這個指令會「列出」目前這個目錄裡的所有東西（檔案和子目錄），就像打開資料夾看裡面有什麼。\n\n我在這裡放了幾樣東西，輸入 ls 就能看到它們的名字。"
goal: "輸入 ls（小寫 L 加 S），按 Enter，列出目前目錄的內容。"
teaches: [ls]
xp: 10
hints:
  - "ls 是 list（列出）的縮寫。"
  - "只要打 ls，後面什麼都不用加，然後按 Enter。"
setup: |
  cd /home/player
  mkdir -p logbook tools
  if [ "${LBP_LANG:-}" = en ]; then echo "Welcome to Kernel-7" > welcome.txt; else echo "歡迎來到 Kernel-7" > welcome.txt; fi
check: |
  [[ "$LBP_LAST" == "ls" ]]
solution: |
  ls
