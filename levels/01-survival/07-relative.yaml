id: "1-07"
title: 相對路徑與 ..
kind: practice
cwd: /home/player/station/deck-2/engine/core
story: "除了從 / 開始的絕對路徑，還有「相對路徑」：從你「現在站的位置」出發。\n\n兩個特殊符號：\n  .   代表「這裡」（目前目錄）\n  ..  代表「上一層」（外面那個目錄）\n\n例如你在 /a/b/c，cd .. 會到 /a/b；cd ../.. 會一次退兩層到 /a。你現在深入引擎核心，要往外退。"
goal: "不要用 / 開頭的路徑，只用 .. 從 core 退回上兩層，到 deck-2 目錄。"
teaches: [cd]
xp: 15
hints:
  - ".. 是上一層，所以要退兩層就連著寫兩個：../.."
  - "打：cd ../..（中間用斜線隔開）"
  - "打完用 pwd 確認，結尾應該是 deck-2。"
setup: |
  mkdir -p /home/player/station/deck-2/engine/core
check: |
  [[ "$LBP_CWD" == /home/player/station/deck-2 ]] || { echo '你還沒到 station/deck-2。'; exit 1; }
solution: |
  cd ../..
golf: 8
