id: "1-13"
title: 自己查說明書
kind: practice
story: "沒有人記得所有指令的所有選項，高手只是更會查。Linux 內建說明書：man 指令名稱（man 是 manual，手冊），例如 man ls。\n\n說明書的操作跟 less 一模一樣：空白鍵翻頁、/關鍵字 搜尋、n 下一個、q 離開。說明書是英文的，但選項長得像 -S，旁邊會有一句話解釋它的作用。"
goal: "查 man ls，找出「依檔案大小排序」的選項字母，用 answer 提交（只要字母，大小寫要對，例如 answer X）。"
teaches: [man]
xp: 20
hints:
  - "打 man ls，進去後打 /size 再按 Enter 搜尋 size 這個字。"
  - "在結果裡找一行寫著 sort by file size 的，它左邊的 -X 就是選項（X 是個大寫字母）。"
  - "按 q 離開後，answer 那個字母。"
setup: ""
check: |
  [[ "$LBP_ANSWER" == "S" || "$LBP_ANSWER" == "-S" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "不對，再查一次 man ls 的 sort 相關選項。"
  exit 1
solution: |
  man ls | grep -i -m1 'sort by file size'
  answer S
