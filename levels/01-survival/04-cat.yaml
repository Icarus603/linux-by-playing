id: "1-04"
title: 讀取日誌
kind: learn
cwd: /home/player/logbook
story: "你已經在日誌室了。cat 會把一個檔案的內容直接「印」在螢幕上，格式：cat 檔名。（它的名字來自 concatenate，連接，但新手只要記得它是「讀檔」就好。）\n\n前任管理員 Vega 在日誌裡留了「通行碼」，而且這組密碼每次登艙都會換，所以你得真的去讀。\n\n另外，遊戲裡要提交答案時，輸入 answer 加一個空格再加答案，例如 answer ABC-123。"
goal: "先用 cat entry-001.txt 讀日誌，找到寫著「通行碼：」的那一行，再打 answer 通行碼 提交（只要冒號後面那段）。"
teaches: [cat, answer]
xp: 15
hints:
  - "先打：cat entry-001.txt，檔名要完整，包含 .txt。"
  - "在印出來的文字裡找「通行碼：」，把冒號後面那串字元抄下來。"
  - "最後打 answer 空格 那串字元。例如通行碼是 XYZ-789，就打 answer XYZ-789。"
setup: |
  code="NOVA-$((RANDOM % 9000 + 1000))"
  mkdir -p /home/player/logbook /var/lib/lbp
  if [ "${LBP_LANG:-}" = en ]; then
    printf 'Flight Log #1\nSupplies restocked today.\nAccess code: %s\nNote: do not leak.\n' "$code" > /home/player/logbook/entry-001.txt
  else
    printf '航行日誌 #1\n今日補給完成。\n通行碼：%s\n備註：請勿外流。\n' "$code" > /home/player/logbook/entry-001.txt
  fi
  echo "$code" > /var/lib/lbp/answer
  chmod 600 /var/lib/lbp/answer
check: |
  [[ -s /var/lib/lbp/answer && "$LBP_ANSWER" == "$(cat /var/lib/lbp/answer)" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "通行碼不對，再仔細看一次日誌。"
  exit 1
reveal: "Vega 的最後一則日誌寫著：「Warden 開始不聽話了。如果有人讀到這個，別相信它的狀態報告。」站上自己的 AI，為什麼要提防它？"
solution: |
  cat entry-001.txt
  answer "$(grep -E '通行碼|Access code' entry-001.txt | sed 's/^[^:：]*[:：] *//')"
