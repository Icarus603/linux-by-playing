id: "1-04"
title: 讀取日誌
kind: learn
cwd: /home/player/logbook
story: "你已經在日誌室了。cat 會把檔案內容印在螢幕上。前任管理員 Vega 在日誌裡留了通行碼，而且這組密碼每次登艙都會換。"
goal: "用 cat 讀 entry-001.txt，找到「通行碼」，再輸入 answer 通行碼 提交（例如 answer ABC-123）。"
teaches: [cat, answer]
xp: 15
hints:
  - "cat entry-001.txt"
  - "找到那行「通行碼：」後面的文字，然後輸入 answer 加上那段文字。"
setup: |
  code="NOVA-$((RANDOM % 9000 + 1000))"
  mkdir -p /home/player/logbook /var/lib/lbp
  printf '航行日誌 #1\n今日補給完成。\n通行碼：%s\n備註：請勿外流。\n' "$code" > /home/player/logbook/entry-001.txt
  echo "$code" > /var/lib/lbp/answer
  chmod 600 /var/lib/lbp/answer
check: |
  [[ -s /var/lib/lbp/answer && "$LBP_ANSWER" == "$(cat /var/lib/lbp/answer)" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "通行碼不對，再仔細看一次日誌。"
  exit 1
reveal: "Vega 的最後一則日誌寫著：「Warden 開始不聽話了。如果有人讀到這個——別相信它的狀態報告。」"
solution: |
  cat entry-001.txt
  answer "$(grep 通行碼 entry-001.txt | sed 's/.*：//')"
