id: "1-09"
title: 隱藏的檔案
kind: practice
story: "在 Linux，檔名以一個點 . 開頭的檔案叫「隱藏檔」，平常的 ls 不會列出它們（像是設定檔，避免被誤動）。要看到全部，要加選項 -a（all，全部）：ls -a。\n\nVega 習慣把重要的東西藏在這種地方，大概是怕被 Warden 看見。"
goal: "這間艙房裡藏著一把看不見的金鑰檔。先用 ls -a 找到它，再用 cat 讀出內容，用 answer 提交。"
teaches: [ls, cat]
xp: 20
hints:
  - "普通的 ls 看不到隱藏檔，要打：ls -a"
  - "名字以點開頭、看起來像 .access-token 的就是金鑰檔。"
  - "用 cat .access-token 讀它（點也是檔名的一部分，要打進去），再 answer 內容。"
setup: |
  cd /home/player
  if [ "${LBP_LANG:-}" = en ]; then echo "Ordinary file" > readme.txt; else echo "普通檔案" > readme.txt; fi
  t="TOKEN-$((RANDOM % 9000 + 1000))"
  echo "$t" > .access-token
  mkdir -p /var/lib/lbp && echo "$t" > /var/lib/lbp/answer && chmod 600 /var/lib/lbp/answer
check: |
  [[ -s /var/lib/lbp/answer && "$LBP_ANSWER" == "$(cat /var/lib/lbp/answer)" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "金鑰不對。"
  exit 1
reveal: "那把金鑰屬於 Vega。他把所有重要的東西都藏在「點開頭」的檔案裡，這個習慣後來救了他一命。"
solution: |
  ls -a
  answer "$(cat .access-token)"
