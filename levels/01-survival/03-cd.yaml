id: "1-03"
title: 走進艙門
kind: learn
story: "cd 讓你「走進」另一個目錄，格式是：cd 目錄名稱（cd 和名稱之間要有一個空格）。cd 是 change directory（切換目錄）的縮寫。\n\n剛才 ls 看到的東西裡，有一個叫 logbook 的目錄（航行日誌室），我們進去看看。"
goal: "打 cd logbook 走進 logbook 目錄，成功時命令列的路徑會變成 ~/logbook。"
teaches: [cd]
xp: 10
hints:
  - "格式是 cd 空格 目錄名稱。"
  - "目錄就在你現在的位置，所以直接打：cd logbook"
setup: |
  mkdir -p /home/player/logbook
  if [ "${LBP_LANG:-}" = en ]; then echo "No anomalies today." > /home/player/logbook/entry-000.txt; else echo "今日無異常。" > /home/player/logbook/entry-000.txt; fi
check: |
  [[ "$LBP_CWD" == /home/player/logbook ]]
solution: |
  cd logbook
golf: 10
