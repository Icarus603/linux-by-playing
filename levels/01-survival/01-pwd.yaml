id: "1-01"
title: 我在哪裡？
kind: learn
story: "歡迎登艙，我是 Pip！Kernel-7 號空間站只剩這一台終端機還亮著，前任管理員 Vega 失蹤了。想找到他，先學會看清自己站在哪：終端機就像站內走廊，你永遠站在某個目錄裡。"
goal: 輸入 pwd，印出你目前所在的目錄。
teaches: [pwd]
xp: 10
hints:
  - pwd 是 print working directory 的縮寫。
  - 直接輸入 pwd 然後按 Enter。
setup: ""
check: |
  [[ "$LBP_LAST" == "pwd" ]]
solution: |
  pwd
