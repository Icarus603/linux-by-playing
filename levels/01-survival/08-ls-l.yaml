id: "1-08"
title: 詳細清單
kind: learn
story: "指令後面可以加「選項」來改變它的行為，選項通常是一個減號加一個字母。ls 單獨用只顯示名字，加上 -l（小寫 L，long 的意思）就會變成「詳細清單」，每個檔案一行，像這樣：\n  -rw-r--r-- 1 player player 2048 Jan 5 10:00 report.dat\n其中那個 2048 就是檔案大小（單位 bytes，位元組）；最後是檔名。\n\n貨艙管理員想知道 report.dat 的大小，而每次登艙數字都不同。"
goal: "用 ls -l 查出 report.dat 的大小，用 answer 數字 提交。"
teaches: [ls]
xp: 15
hints:
  - "先打 ls -l（注意 ls 和 -l 之間有空格）。"
  - "在 report.dat 那一行，檔名左邊有一串數字，緊接在 player player 後面的那個就是大小。"
  - "想只看這一個檔案，可以打 ls -l report.dat。"
setup: |
  cd /home/player
  n=$((RANDOM % 9000 + 1000))
  truncate -s $n report.dat
  truncate -s 128 manifest.dat
  truncate -s 20000 cargo.dat
  mkdir -p /var/lib/lbp && echo $n > /var/lib/lbp/answer && chmod 600 /var/lib/lbp/answer
check: |
  [[ -s /var/lib/lbp/answer && "$LBP_ANSWER" == "$(cat /var/lib/lbp/answer)" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "大小不對，注意要看 report.dat 那一行的第 5 欄。"
  exit 1
solution: |
  ls -l report.dat
  answer "$(stat -c %s report.dat)"
