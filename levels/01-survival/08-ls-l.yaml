id: "1-08"
title: 詳細清單
kind: learn
story: "ls 加上 -l 會顯示詳細資訊：權限、擁有者、大小、修改時間。貨艙管理員問你 report.dat 的大小，每次的數字都不同。"
goal: "用 ls -l 查出 report.dat 的大小（位元組），用 answer 數字 提交。"
teaches: [ls]
xp: 15
hints:
  - "ls -l 的第 5 欄是檔案大小（bytes）。"
  - "ls -l report.dat 只看那一個檔案。"
setup: |
  cd /home/player
  n=$((RANDOM % 9000 + 1000))
  truncate -s $n report.dat
  truncate -s 128 manifest.dat
  truncate -s 20000 cargo.dat
  mkdir -p /var/lib/lbp && echo $n > /var/lib/lbp/answer && chmod 600 /var/lib/lbp/answer
check: |
  [[ -s /var/lib/lbp/answer && "$LBP_ANSWER" == "$(cat /var/lib/lbp/answer)" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "大小不對，注意要看 report.dat 那一行的第 5 欄。"
  exit 1
solution: |
  ls -l report.dat
  answer "$(stat -c %s report.dat)"
