id: "4-21"
title: jq：處理 JSON
kind: practice
story: "現代的網路服務多半回傳 JSON 格式的資料，長得像：\n  {\"crew\": [{\"name\": \"Ann\", \"role\": \"pilot\"}, ...]}\n用 grep 很難處理它。jq 是專門處理 JSON 的工具：\n  .crew        取出 crew 這個欄位\n  .crew[]      把清單裡的每個項目逐一取出\n  select(條件)  只留下符合條件的項目\n  -r           輸出文字時不要加引號"
goal: "crew.json 是船員名單。找出職位（role）是 pilot 的人，answer 提交他的名字。"
teaches: [jq]
xp: 30
hints:
  - "先看看資料長怎樣：jq '.crew[]' crew.json"
  - "要篩出 pilot 的人，用 select(.role==\"pilot\")，再取 .name。"
  - "打：jq -r '.crew[] | select(.role==\"pilot\") | .name' crew.json"
setup: |
  cd /home/player
  cat > crew.json <<'JSON'
  {"station":"kernel-7","crew":[
    {"name":"Ada","role":"engineer"},
    {"name":"Grace","role":"pilot"},
    {"name":"Linus","role":"medic"}
  ]}
  JSON
check: |
  [[ "$LBP_ANSWER" == "Grace" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "不是那位，確認 role 是 pilot。"
  exit 1
solution: |
  jq -r '.crew[] | select(.role=="pilot") | .name' crew.json
  answer Grace
