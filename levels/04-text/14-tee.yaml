id: "4-14"
title: tee：邊看邊存
kind: practice
story: "tee 就像水管上的三通接頭：資料一邊繼續往下流（印在螢幕上），一邊複製一份存進檔案。用 > 存檔，螢幕就看不到了；用 tee 則「邊看邊存」：\n  指令 | tee 檔名"
goal: "把 ls /etc 輸出的前 5 行，用 tee 同時顯示在螢幕並存成 first5.txt。"
teaches: [tee, head]
xp: 20
hints:
  - "先用 ls /etc | head -5 取前 5 行。"
  - "再接 | tee first5.txt，結果會顯示並存檔。"
  - "打：ls /etc | head -5 | tee first5.txt"
setup: ""
check: |
  cd /home/player
  [[ $(wc -l < first5.txt 2>/dev/null) -eq 5 ]] || { echo 'first5.txt 要剛好 5 行。'; exit 1; }
  [[ "$LBP_LAST" == *tee* ]] || { echo '這關要用 tee。'; exit 1; }
solution: |
  ls /etc | head -5 | tee first5.txt
