id: "4-10"
title: tr：字元轉換
kind: practice
story: "tr 逐字元轉換或刪除。它只讀標準輸入，所以要用 < 把檔案餵給它。"
goal: "把 msg.txt 的小寫全部轉成大寫，結果存成 loud.txt。"
teaches: [tr, "<"]
xp: 20
hints:
  - "tr 'a-z' 'A-Z' < msg.txt > loud.txt"
setup: |
  cd /home/player
  echo "all systems nominal" > msg.txt
check: |
  [[ "$(cat /home/player/loud.txt 2>/dev/null)" == "ALL SYSTEMS NOMINAL" ]]
solution: |
  tr 'a-z' 'A-Z' < msg.txt > loud.txt
