id: "4-01"
title: wc：數一數
kind: learn
story: "接下來進入 Unix 的靈魂：文字處理。Linux 把設定、日誌、資料幾乎都存成純文字，所以會處理文字就等於會操控整個系統。\n\n第一個工具 wc（word count，數數）：\n  wc -l 檔名   數有幾「行」（l = lines）\n  wc -w 檔名   數有幾個「字」\n  wc -c 檔名   數有幾個「位元組」"
goal: "crew.txt 每行寫一位船員。用 wc -l 算出船員人數，answer 提交。"
teaches: [wc]
xp: 10
hints:
  - "每行一位船員，所以「行數」就是人數。"
  - "格式：wc -l 檔名"
  - "打：wc -l crew.txt，輸出開頭那個數字就是答案。"
setup: |
  cd /home/player
  for i in $(seq 1 42); do echo "crew-$i"; done > crew.txt
check: |
  [[ "$LBP_ANSWER" == "42" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "人數不對。"
  exit 1
solution: |
  wc -l crew.txt
  answer 42
