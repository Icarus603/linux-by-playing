id: "4-22"
title: paste 與其他小工具
kind: practice
story: "paste 把多個檔案「橫著」併起來：第一個檔的第 1 行接上第二個檔的第 1 行，以此類推（中間用 Tab 隔開）。像把兩欄資料並排貼成一張表。\n\n另外還有幾個小工具：nl 加行號、column -t 把資料對齊成表格、rev 把每行反過來、fold 把長行折斷。"
goal: "把 names.txt 與 ages.txt 用 paste 橫向合併，存成 people.tsv。"
teaches: [paste, nl, column, rev, fold]
xp: 20
hints:
  - "格式：paste 檔案1 檔案2"
  - "合併結果用 > 存成檔案。"
  - "打：paste names.txt ages.txt > people.tsv"
setup: |
  cd /home/player
  printf 'ann\nbob\ncat\n' > names.txt
  printf '31\n27\n45\n' > ages.txt
check: |
  cd /home/player
  diff <(paste names.txt ages.txt) people.tsv >/dev/null
solution: |
  paste names.txt ages.txt > people.tsv
