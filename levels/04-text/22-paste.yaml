id: "4-22"
title: paste 與其他小工具
kind: practice
story: "paste 把多個檔案「橫向」合併。還有 nl（加行號）、column -t（對齊成表格）、rev（反轉每行）、fold（斷行），都是好用的小工具。"
goal: "把 names.txt 與 ages.txt 用 paste 橫向合併，存成 people.tsv。"
teaches: [paste, nl, column, rev, fold]
xp: 20
hints:
  - "paste names.txt ages.txt > people.tsv"
setup: |
  cd /home/player
  printf 'ann\nbob\ncat\n' > names.txt
  printf '31\n27\n45\n' > ages.txt
check: |
  cd /home/player
  diff <(paste names.txt ages.txt) people.tsv >/dev/null
solution: |
  paste names.txt ages.txt > people.tsv
