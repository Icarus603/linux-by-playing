id: "4-15"
title: sed：搜尋取代
kind: learn
story: "sed 是「串流編輯器」，像文字處理器裡的「尋找並取代」，但用指令操作。最常用的寫法：\n  sed 's/舊/新/g' 檔名\n意思是：把每行的「舊」換成「新」（s = substitute 取代；g = global，一行裡出現多次都換）。\n平常 sed 只是把結果印出來，檔案不會變；加上 -i（in-place，原地）才會真的改寫檔案。改檔前先想想要不要備份。"
goal: "app.conf 裡的 localhost 全部要換成 10.0.0.5，直接修改檔案本身。"
teaches: [sed]
xp: 25
hints:
  - "要直接改檔案，用 -i。"
  - "格式：sed -i 's/舊/新/g' 檔名"
  - "打：sed -i 's/localhost/10.0.0.5/g' app.conf，再 cat app.conf 檢查。"
setup: |
  cd /home/player
  printf 'db=localhost\ncache=localhost\nqueue=localhost\nname=kernel7\n' > app.conf
check: |
  cd /home/player
  ! grep -q localhost app.conf && [[ $(grep -c '10.0.0.5' app.conf) -eq 3 ]] && grep -q 'name=kernel7' app.conf
solution: |
  sed -i 's/localhost/10.0.0.5/g' app.conf
golf: 39
golf_solution: |
  sed -i s/localhost/10.0.0.5/g app.conf
