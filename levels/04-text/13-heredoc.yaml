id: "4-13"
title: Here Document
kind: practice
story: "想直接在終端機輸入「好幾行」文字存進檔案怎麼辦？用 Here Document：\n  cat > 檔名 << EOF\n  （接著一行一行輸入內容）\n  EOF\n意思是：「從現在起的輸入都當作檔案內容，直到我單獨打一行 EOF 為止」。EOF 只是約定好的結束暗號（End Of File），可以換成別的詞。寫設定檔、腳本超方便。"
goal: "用 cat > motd.txt << EOF 建立三行的檔案，內容依序為 Welcome、aboard、Kernel-7，最後單獨一行輸入 EOF 結束。"
teaches: ["<<"]
xp: 25
hints:
  - "先輸入 cat > motd.txt << EOF 然後按 Enter，游標會等你繼續輸入。"
  - "接著逐行輸入：Welcome、aboard、Kernel-7，每行按一次 Enter。"
  - "最後單獨一行打 EOF 並按 Enter 結束。用 cat motd.txt 檢查。"
setup: ""
check: |
  cd /home/player
  diff <(printf '%s\n' Welcome aboard Kernel-7) motd.txt >/dev/null
solution: |
  cat > motd.txt << EOF
  Welcome
  aboard
  Kernel-7
  EOF
