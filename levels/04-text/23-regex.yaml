id: "4-23"
title: 正規表示式
kind: practice
story: "正規表示式是描述文字模式的語言。grep -oE 只印出符合的部分（而不是整行）。[a-z]+ 代表一個以上小寫字母，@ 就是 @。"
goal: "contacts.txt 是一份雜亂的文字，裡面散落著 Email。找出所有「不重複」的 Email 有幾個，answer 提交。"
teaches: [grep, sort, uniq, wc]
xp: 30
hints:
  - "grep -oE '[A-Za-z0-9._]+@[A-Za-z0-9.]+' contacts.txt"
  - "再接 sort -u 去重、wc -l 計數。"
setup: |
  cd /home/player
  cat > contacts.txt <<'TXT'
  Call ann at ann@kernel7.io or bob@kernel7.io today.
  Dan wrote: reach me via dan@mail.org, not ann@kernel7.io!
  No email on this line.
  Backup: bob@kernel7.io and eve@x.net.
  TXT
check: |
  cd /home/player
  exp=$(grep -oE '[A-Za-z0-9._]+@[A-Za-z0-9]+(\.[A-Za-z0-9]+)+' contacts.txt | sort -u | wc -l)
  [[ "$LBP_ANSWER" == "$exp" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "數量不對，記得去重。"
  exit 1
solution: |
  grep -oE '[A-Za-z0-9._]+@[A-Za-z0-9.]+' contacts.txt | sort -u | wc -l
  answer 4
