id: "2-11"
title: 大括號展開
kind: practice
story: "大括號 {a,b,c} 是 shell 的「展開」功能：它會把一個寫法變成好幾個。\n\n例如 log-{jan,feb,mar}.txt 會被自動變成三個詞：log-jan.txt log-feb.txt log-mar.txt。所以一行指令就能一口氣建三個檔案（逗號後面不能有空格）。"
goal: "用大括號展開，一行指令建立 log-jan.txt、log-feb.txt、log-mar.txt。"
teaches: [touch, "{}"]
xp: 15
hints:
  - "大括號裡用逗號分隔，逗號旁邊不要有空格。"
  - "touch 可以一次建多個檔案，後面接大括號展開。"
  - "打：touch log-{jan,feb,mar}.txt"
setup: ""
check: |
  cd /home/player
  [[ -f log-jan.txt && -f log-feb.txt && -f log-mar.txt && "$LBP_LAST" == *"{"* ]]
solution: |
  touch log-{jan,feb,mar}.txt
