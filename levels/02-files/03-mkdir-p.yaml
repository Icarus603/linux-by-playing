id: "2-03"
title: 一次蓋好整層樓
kind: practice
story: "如果想一口氣建好好幾層，例如 a 裡面有 b、b 裡面有 c，直接 mkdir a/b/c 會失敗，因為 a 和 b 都還不存在。\n\n加上選項 -p（parents，上層目錄）就會「連同缺少的上層一起建」：mkdir -p a/b/c。"
goal: "用一個指令建立 ship/deck/engine/core 這條四層的目錄路徑。"
teaches: [mkdir]
xp: 15
hints:
  - "普通 mkdir 只能建一層，要加 -p 才能連上層一起建。"
  - "格式：mkdir -p 路徑"
  - "打：mkdir -p ship/deck/engine/core"
setup: ""
check: |
  [[ -d /home/player/ship/deck/engine/core ]]
solution: |
  mkdir -p ship/deck/engine/core
