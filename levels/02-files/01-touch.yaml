id: "2-01"
title: 建立第一個檔案
kind: learn
story: "好的艙房需要整理。先學怎麼「無中生有」：touch 檔名 會建立一個空白的新檔案（裡面什麼都沒有）。如果檔案已經存在，它不會動內容，只是把「最後修改時間」更新成現在。"
goal: "在目前所在的家目錄，建立一個空檔案 notes.txt。"
teaches: [touch]
xp: 10
hints:
  - "格式是 touch 空格 檔名。"
  - "打：touch notes.txt"
  - "建好後用 ls 看看，應該會出現 notes.txt。"
setup: ""
check: |
  [[ -f /home/player/notes.txt ]] || { echo '家目錄裡還沒有 notes.txt。'; exit 1; }
solution: |
  touch notes.txt
golf: 15
