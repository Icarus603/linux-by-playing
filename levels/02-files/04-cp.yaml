id: "2-04"
title: 備份一份
kind: learn
story: "動手改重要檔案之前，先備份是好習慣。cp（copy，複製）的格式是：cp 來源 目的地。\n\n原檔不會被動，會多出一份一模一樣的。如果目的地寫的是新檔名，就是「複製並取新名字」。"
goal: "把 blueprint.txt 複製成 blueprint.bak（原檔要保留）。"
teaches: [cp]
xp: 10
hints:
  - "格式：cp 來源檔 新檔名"
  - "打：cp blueprint.txt blueprint.bak"
  - "用 ls 看，兩個檔案應該都在。"
setup: |
  echo "reactor blueprint v3" > /home/player/blueprint.txt
check: |
  [[ -f /home/player/blueprint.txt ]] || { echo 'blueprint.txt 不見了，這關是複製，不是搬移。'; exit 1; }
  [[ -f /home/player/blueprint.bak ]] || { echo '還沒有 blueprint.bak。'; exit 1; }
  cmp -s /home/player/blueprint.txt /home/player/blueprint.bak || { echo 'blueprint.bak 的內容和原檔不同。'; exit 1; }
solution: |
  cp blueprint.txt blueprint.bak
golf: 23
golf_solution: |
  cp blueprint.{txt,bak}
