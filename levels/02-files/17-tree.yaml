id: "2-17"
title: 看見整棵樹
kind: practice
story: "tree 會把目錄結構畫成一棵樹，一眼就能看清誰在誰裡面：\n  tree 目錄   畫出整棵樹\n  tree -L 2   只顯示兩層深（-L 是限制深度）\n  tree -a     連隱藏檔也顯示"
goal: "用 tree vault 看這個目錄，找出藏在最深一層的檔案名稱（含副檔名），answer 提交。"
teaches: [tree]
xp: 20
hints:
  - "打：tree vault"
  - "縮排最多、最靠右下方的那個檔案，就是最深的。"
  - "answer 它的完整檔名，包含 . 後面的副檔名。"
setup: |
  cd /home/player
  mkdir -p vault/a/b/c/d
  echo x > vault/a/one.txt
  echo x > vault/a/b/two.txt
  echo x > vault/a/b/c/d/deepest.key
check: |
  [[ "$LBP_ANSWER" == "deepest.key" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "再往下看，要最深的一層。"
  exit 1
solution: |
  tree vault
  answer deepest.key
