id: "5-04"
title: 八進位權限
kind: practice
story: "權限也能用數字表示：r=4、w=2、x=1，三個數字依序是 擁有者、群組、其他人。例如 755 = rwxr-xr-x，600 = rw-------。"
goal: "secret.txt 是機密，要設成只有擁有者能讀寫，其他人完全沒有權限（600）。"
teaches: [chmod]
xp: 15
hints:
  - "chmod 600 secret.txt"
setup: |
  cd /home/player
  echo "launch codes" > secret.txt
  chmod 644 secret.txt
check: |
  [[ "$(stat -c %a /home/player/secret.txt)" == "600" ]]
solution: |
  chmod 600 secret.txt
golf: 20
