id: "5-02"
title: 讀懂權限字串
kind: learn
story: "ls -l 每行最左邊那串，像 -rw-r--r--，就是這個檔案的「權限」，共 10 個字元：\n  第 1 個：類型（- 是檔案，d 是目錄）\n  接著三組，每組三個字元，依序代表「擁有者｜群組｜其他人」\n  每組的三個字元是 r（可讀）、w（可寫）、x（可執行），沒有就是 -\n所以 -rw-r--r-- 的意思是：擁有者可讀寫，群組只能讀，其他人只能讀。\n\n有個檔案被不小心設成「任何人都能改寫」，很危險。"
goal: "a.txt、b.txt、c.txt 其中一個，「其他人」也可以寫入（最後三個字元裡有 w）。找出它，answer 提交檔名。"
teaches: [ls]
xp: 15
hints:
  - "打：ls -l，看每個檔案左邊的權限字串。"
  - "只看權限字串「最後三個字元」，那是其他人的權限。"
  - "最後三個字元是 rw- 或 -w- 的那個檔案（有 w）就是答案。"
setup: |
  cd /home/player
  touch a.txt b.txt c.txt
  chmod 644 a.txt; chmod 666 b.txt; chmod 600 c.txt
check: |
  [[ "$LBP_ANSWER" == "b.txt" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "不是這個，找最後一組權限有 w 的。"
  exit 1
solution: |
  ls -l
  answer b.txt
