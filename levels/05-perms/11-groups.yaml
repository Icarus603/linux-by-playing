id: "5-11"
title: 群組管理
kind: practice
story: "「群組」是一群使用者的集合。把權限設給群組，就等於一次設給群組裡的所有人，不用一個個設。\n  sudo groupadd 群組名            建立群組\n  sudo usermod -aG 群組名 帳號    把使用者加進群組\n重要：usermod 的 -aG 裡 a（append，追加）絕對不能漏，漏了會把他原本所屬的其他群組全部踢掉。"
goal: "建立群組 engineers，並把使用者 cadet 加進去。"
teaches: [groupadd, usermod, groups]
xp: 25
hints:
  - "先建群組：sudo groupadd engineers"
  - "再把人加進去：sudo usermod -aG engineers cadet"
  - "用 id cadet 或 groups cadet 確認，應該看到 engineers。"
setup: |
  getent group engineers >/dev/null && groupdel engineers || true
  id cadet >/dev/null 2>&1 || useradd -m -s /bin/bash cadet
check: |
  id -nG cadet 2>/dev/null | tr ' ' '\n' | grep -qx engineers || { echo 'cadet 還不在 engineers 群組裡。'; exit 1; }
cleanup: |
  userdel -r cadet 2>/dev/null || true
  groupdel engineers 2>/dev/null || true
solution: |
  sudo groupadd engineers
  sudo usermod -aG engineers cadet
