id: "5-11"
title: 群組管理
kind: practice
story: "群組讓你一次替多個人設定權限。groupadd 建立群組，usermod -aG 把使用者加進群組（-a 是追加，千萬不能漏，否則會把他原本的群組全部踢掉）。"
goal: "建立群組 engineers，並把使用者 cadet 加進去。"
teaches: [groupadd, usermod, groups]
xp: 25
hints:
  - "sudo groupadd engineers"
  - "sudo usermod -aG engineers cadet"
  - "用 id cadet 或 groups cadet 確認結果。"
setup: |
  getent group engineers >/dev/null && groupdel engineers || true
  id cadet >/dev/null 2>&1 || useradd -m -s /bin/bash cadet
check: |
  id -nG cadet 2>/dev/null | tr ' ' '\n' | grep -qx engineers
cleanup: |
  userdel -r cadet 2>/dev/null || true
  groupdel engineers 2>/dev/null || true
solution: |
  sudo groupadd engineers
  sudo usermod -aG engineers cadet
