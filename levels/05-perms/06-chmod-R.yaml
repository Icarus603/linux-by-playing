id: "5-06"
title: 遞迴與大寫 X
kind: practice
story: "要把權限套用到整個目錄樹（目錄和裡面所有東西），用 -R（recursive，遞迴）：chmod -R。\n\n但有個陷阱：目錄需要 x 才能進入，普通檔案卻不該有 x。這時用「大寫 X」：它只對「目錄」（以及原本就可執行的檔案）加 x，普通檔案不會被誤加執行權限。\n  chmod -R a+rX 目錄   所有人都能讀，目錄還能進入"
goal: "public 目錄樹要對所有人公開唯讀：所有檔案其他人可讀，所有目錄其他人可讀可進入。檔案不要被加上執行權限。"
teaches: [chmod]
xp: 25
hints:
  - "a 是所有人，+r 是加讀取，大寫 X 是「只對目錄加執行」。"
  - "整棵樹都要，所以加 -R。"
  - "打：chmod -R a+rX public"
setup: |
  cd /home/player
  mkdir -p public/docs/old
  echo a > public/index.html
  echo b > public/docs/guide.txt
  echo c > public/docs/old/legacy.txt
  chmod -R go-rwx public
check: |
  cd /home/player/public
  [[ -z "$(find . -type f ! -perm -o=r)" ]] || { echo 'public 裡有檔案其他人讀不到。'; exit 1; }
  [[ -z "$(find . -type d ! -perm -o=rx)" ]] || { echo 'public 裡有目錄其他人不能進入。'; exit 1; }
  [[ -z "$(find . -type f -perm /111)" ]] || { echo 'public 裡有一般檔案被加上了執行權限。'; exit 1; }
solution: |
  chmod -R a+rX public
