id: "5-07"
title: 一次調整多組
kind: practice
story: "符號模式可以用逗號，一次寫好幾個調整：\n  g+w,o-rwx   群組加上寫入，並且拿掉其他人的全部權限（r、w、x 都拿掉）\n也可以只動某一組、某一個權限，例如 o-rw 是「其他人，拿掉讀和寫」。"
goal: "shared.txt 現在人人可讀寫（666）。調整成：擁有者與群組可讀寫，其他人沒有任何權限（660）。"
teaches: [chmod]
xp: 20
hints:
  - "要變動的是「其他人」（o），拿掉讀和寫。"
  - "打：chmod o-rw shared.txt"
  - "或者直接用數字：chmod 660 shared.txt"
setup: |
  cd /home/player
  echo data > shared.txt
  chmod 666 shared.txt
check: |
  [[ "$(stat -c %a /home/player/shared.txt)" == "660" ]]
solution: |
  chmod o-rw shared.txt
golf: 20
golf_solution: |
  chmod 660 shared.txt
