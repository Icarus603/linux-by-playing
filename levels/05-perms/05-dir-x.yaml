id: "5-05"
title: 目錄的 x 是什麼
kind: practice
story: "權限用在「目錄」上，意思有點不同：\n  r：可以列出目錄裡有什麼（ls）\n  x：可以「進入」這個目錄（cd），以及存取裡面的東西\n少了 x，就算有 r，cd 也會被拒絕（Permission denied）。"
goal: "vault 目錄的權限被設錯，你自己都進不去。修好它，讓擁有者能進入並列出內容。"
teaches: [chmod, cd]
xp: 20
hints:
  - "先試 cd vault，看看錯誤訊息，再用 ls -ld vault 看權限（-d 表示看目錄本身）。"
  - "擁有者需要 r 和 x，所以要加上 x：chmod u+x vault"
  - "或者直接用數字：chmod 700 vault（擁有者全部權限）。"
setup: |
  cd /home/player
  mkdir vault
  echo ok > vault/note.txt
  chmod 644 vault
check: |
  [[ "$(stat -c %a /home/player/vault)" =~ ^[57] ]] || { echo 'vault 的擁有者權限還不夠：目錄要有 r 和 x 才能進入。'; exit 1; }
solution: |
  chmod u+x vault
