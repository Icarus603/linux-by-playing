id: "5-01"
title: 我是誰
kind: learn
story: "Linux 是多人系統，每個使用者有一個數字編號 uid。id 指令會顯示你的 uid、gid 與所屬群組。"
goal: "用 id 查出你的使用者編號（uid），answer 提交那個數字。"
teaches: [id, whoami, groups]
xp: 10
hints:
  - "直接輸入 id，找 uid= 後面的數字。"
  - "id -u 只印 uid。"
setup: ""
check: |
  [[ "$LBP_ANSWER" == "1000" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "不對，用 id 看 uid=。"
  exit 1
solution: |
  id
  answer "$(id -u)"
