id: "5-13"
title: 以別人的身分執行
kind: practice
story: "有時你想知道「某個使用者實際看得到什麼」。sudo -u 使用者 指令 可以用「指定使用者的身分」執行單一指令（-u 是 user）。\n\nghost 的家目錄只有他自己進得去，你直接讀會被拒絕，但借用他的身分就可以。"
goal: "用 sudo -u ghost 讀出 /home/ghost/note.txt，answer 提交內容裡的暗號。"
teaches: [sudo, su]
xp: 25
hints:
  - "先試 cat /home/ghost/note.txt，會被拒絕。"
  - "格式：sudo -u 使用者 指令"
  - "打：sudo -u ghost cat /home/ghost/note.txt，answer 內容裡的暗號。"
setup: |
  id ghost >/dev/null 2>&1 || useradd -m -s /bin/bash ghost
  echo "SIGNAL: ECHO-LIMA" > /home/ghost/note.txt
  chown ghost:ghost /home/ghost/note.txt
  chmod 700 /home/ghost
check: |
  [[ "$LBP_ANSWER" == "ECHO-LIMA" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "暗號不對。"
  exit 1
cleanup: |
  userdel -r ghost 2>/dev/null || true
solution: |
  sudo -u ghost cat /home/ghost/note.txt
  answer ECHO-LIMA
reveal: "ghost 的家目錄裡只有一張紙條：「ECHO-LIMA」。站員名冊上沒有這個人，登入紀錄卻顯示它每晚都會上線。是入侵者，還是別的什麼？"
