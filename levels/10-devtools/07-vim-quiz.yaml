id: "10-07"
title: 如何逃離 vim
kind: practice
story: "這是全世界最有名的問題之一：「我進了 vim 出不來」。冷靜，步驟是：\n  ① 按 Esc（確保在一般模式）\n  ② 輸入冒號指令：\n     :q    離開（沒改過才行）\n     :wq   存檔後離開\n     :q!   放棄所有修改，強制離開（q = quit，驚嘆號 ! 代表「強制」）\n如果你改壞了、想完全放棄剛剛的修改呢？"
goal: "寫出「放棄所有修改並強制離開 vim」的冒號指令（包含冒號），用 answer 提交，例如 answer :xyz"
teaches: [vim]
xp: 20
hints:
  - "q 是 quit（離開），驚嘆號代表強制。"
  - "不存檔的話，不能用 :wq（w 是存檔）。"
  - "答案是冒號 + q + 驚嘆號，連在一起。"
setup: ""
check: |
  [[ "$LBP_ANSWER" == ":q!" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "再想想：quit 加上強制的驚嘆號。"
  exit 1
solution: |
  answer ":q!"
