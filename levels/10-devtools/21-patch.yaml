id: "10-21"
title: 套用修補檔
kind: practice
story: "收到別人給的修補檔，用 patch 把它「套用」到檔案上，檔案會依修補檔的內容被改寫：\n  patch 檔案 < 修補檔\n  patch --dry-run 檔案 < 修補檔     先「演練」：只告訴你能不能成功，不真的修改\n先 --dry-run 預覽再正式套用，是個好習慣。"
goal: "fix.patch 是針對 app.conf 的修補檔。把它套用上去，讓 app.conf 變成修補後的樣子。"
teaches: [patch]
xp: 40
hints:
  - "先演練：patch --dry-run app.conf < fix.patch，看有沒有說成功。"
  - "正式套用：patch app.conf < fix.patch"
  - "用 cat app.conf 確認內容已經改好。"
setup: |
  cd /home/player
  printf 'host=a\nport=80\nmode=safe\n' > app.conf
  printf 'host=a\nport=9090\nmode=safe\nlog=on\n' > /tmp/app.expected
  diff -u app.conf /tmp/app.expected > fix.patch || true
check: |
  cmp -s /home/player/app.conf /tmp/app.expected
solution: |
  patch -s app.conf < fix.patch
