id: "10-10"
title: tmux：分割窗格
kind: practice
story: "一個視窗可以切成多個窗格（pane）：split-window 預設上下分，-h 左右分。互動模式下的快速鍵是前綴鍵 Ctrl-b 再加按鍵（例如 Ctrl-b % 左右分、Ctrl-b \" 上下分、Ctrl-b 方向鍵切換）。"
goal: "建立背景工作階段 dev，並把它的視窗分成 2 個窗格。"
teaches: [tmux]
xp: 40
hints:
  - "tmux new -d -s dev"
  - "tmux split-window -t dev"
  - "tmux list-panes -t dev 可以數窗格。"
setup: |
  runuser -u player -- tmux kill-server 2>/dev/null || true
check: |
  [[ "$(runuser -u player -- tmux list-panes -t dev 2>/dev/null | wc -l)" == "2" ]]
cleanup: |
  runuser -u player -- tmux kill-server 2>/dev/null || true
solution: |
  tmux new -d -s dev
  tmux split-window -t dev
