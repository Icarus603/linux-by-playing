id: "10-05"
title: vim：在結尾新增
kind: practice
story: "進入插入模式有好幾種方式（都在一般模式下按）：\n  i   在游標前面開始輸入　　　a   在游標後面\n  o   在目前這行「下方」新開一行並進入輸入　　O   在上方新開一行\n  A   跳到這行最後面再開始輸入\n寫日誌要在檔尾新增一行，最常用的就是：按 G 跳到檔尾，再按 o。"
goal: "在 log.txt 最後新增一行：mission complete，存檔離開。"
teaches: [vim]
xp: 30
hints:
  - "打：vim log.txt，按 G（大寫）跳到檔案最後一行。"
  - "按 o 會在下方新開一行並進入插入模式，打：mission complete，再按 Esc。"
  - "打 :wq 再 Enter 存檔離開。用 tail log.txt 確認。"
setup: |
  printf 'boot ok\nsystems nominal\n' > /home/player/log.txt
check: |
  [[ "$(cat /home/player/log.txt)" == $'boot ok\nsystems nominal\nmission complete' ]] || { echo 'log.txt 的內容還不對。'; exit 1; }
solution: |
  echo "mission complete" >> log.txt
