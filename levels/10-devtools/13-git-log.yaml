id: "10-13"
title: git log：翻歷史
kind: practice
story: "git log 列出過去所有的提交紀錄，從新到舊。每筆提交有個獨一無二的「雜湊」（一長串英數字，像身分證號碼），通常只看前 7 碼就夠辨識。\n  git log --oneline          每筆一行：「短雜湊 訊息」\n  git log --grep=\"關鍵字\"    只列出訊息裡含關鍵字的提交\n  git log --author=\"名字\"    只列出某人提交的"
goal: "~/repo 的歷史裡有一筆訊息含 fix reactor 的提交。找出它的簡短雜湊（7 碼），answer 提交。"
teaches: [git]
xp: 40
hints:
  - "先進去：cd repo，再打 git log --oneline，每行最前面那串就是短雜湊。"
  - "歷史太長就過濾：git log --oneline --grep=\"fix reactor\""
  - "answer 那一行最前面的 7 個字元。"
setup: |
  P() { runuser -u player -- env HOME=/home/player bash -c "$1"; }
  P 'git config --global user.name Player; git config --global user.email player@kernel-7; git config --global init.defaultBranch main'
  rm -rf /home/player/repo
  P 'mkdir /home/player/repo && cd /home/player/repo && git init -q && for i in 1 2 3; do echo $i > f$i; git add .; git commit -qm "add file $i"; done; echo x > r; git add .; git commit -qm "fix reactor coolant valve"; for i in 5 6; do echo $i > f$i; git add .; git commit -qm "add file $i"; done'
check: |
  exp=$(git -c safe.directory='*' -C /home/player/repo log --oneline --grep='fix reactor' | cut -c1-7)
  [[ "$LBP_ANSWER" == "$exp" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "雜湊不對，取 --oneline 前面的 7 碼。"
  exit 1
reveal: "修復反應爐的那筆提交，作者是 vega，時間是他失蹤前三小時。提交者信箱寫的是 ghost@kernel-7，暗號 ECHO-LIMA 也出現在備註裡：那個幽靈帳號，是 Vega 自己。他在失蹤前還在努力維修這座站。"
solution: |
  cd repo
  git log --oneline --grep="fix reactor"
  answer "$(git log --oneline --grep='fix reactor' | cut -c1-7)"
