id: "10-08"
title: tmux：永不斷線的工作階段
kind: learn
story: "tmux 是終端機多工器：工作階段（session）在背景持續執行，即使你斷線、關掉終端機，裡面的程式都還在，之後可以重新連回。這是遠端工作的救星。-d 讓它在背景建立，-s 指定名稱。"
goal: "建立一個名叫 work 的 tmux 工作階段（在背景，不要進去）。用 tmux ls 確認。"
teaches: [tmux]
xp: 30
hints:
  - "tmux new -d -s work"
  - "tmux ls 列出所有工作階段。"
setup: |
  runuser -u player -- tmux kill-server 2>/dev/null || true
check: |
  runuser -u player -- tmux ls 2>/dev/null | grep -q '^work:'
cleanup: |
  runuser -u player -- tmux kill-server 2>/dev/null || true
solution: |
  tmux new -d -s work
