id: "10-03"
title: vim：模式的藝術
kind: learn
story: "vim 是幾乎每台伺服器都有的編輯器，很強但一開始會讓人困惑，因為它有「模式」：\n  一般模式   剛開啟時的狀態，按鍵是「指令」（移動、刪除…），不是打字。隨時按 Esc 回到這裡\n  插入模式   在一般模式按 i 進入，這時才能打字，左下角會顯示 -- INSERT --\n  命令列     在一般模式按冒號 : 開頭：\n     :w 存檔　:q 離開　:wq 存檔並離開　:q! 放棄修改強制離開\n\n新手安全流程：開檔 → 按 i → 修改文字 → 按 Esc → 打 :wq 再 Enter。"
goal: "用 vim config.txt 開啟檔案，把 mode=safe 改成 mode=fast，存檔離開。"
teaches: [vim]
xp: 35
hints:
  - "打：vim config.txt，用方向鍵把游標移到 mode=safe 那行的 safe 上。"
  - "最簡單：按 i 進入插入模式，用 Backspace 刪掉 safe，打 fast，再按 Esc 回一般模式。"
  - "打 :wq（先冒號再 wq）按 Enter，存檔並離開。"
setup: |
  printf 'host=kernel7\nport=8080\nmode=safe\n' > /home/player/config.txt
check: |
  [[ "$(cat /home/player/config.txt)" == $'host=kernel7\nport=8080\nmode=fast' ]]
solution: |
  sed -i 's/mode=safe/mode=fast/' config.txt
