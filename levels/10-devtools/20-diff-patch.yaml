id: "10-20"
title: 製作修補檔
kind: practice
story: "diff -u 舊 新 產生統一格式的差異，能儲存成修補檔（patch），發給別人套用。這是開源專案最古老的協作方式之一。"
goal: "old.txt 與 new.txt 是同一份設定的兩個版本。產生修補檔 fix.patch（diff -u old.txt new.txt），讓別人把 old.txt 套用它就能變成 new.txt。"
teaches: [diff, patch]
xp: 40
hints:
  - "diff -u old.txt new.txt > fix.patch"
setup: |
  cd /home/player
  printf 'host=a\nport=80\nmode=safe\n' > old.txt
  printf 'host=a\nport=8080\nmode=safe\ndebug=on\n' > new.txt
check: |
  cd /home/player
  [[ -s fix.patch ]] || { echo "還沒有 fix.patch。"; exit 1; }
  patch -s -o /tmp/patched.out old.txt fix.patch >/dev/null 2>&1 && cmp -s /tmp/patched.out new.txt
solution: |
  diff -u old.txt new.txt > fix.patch
