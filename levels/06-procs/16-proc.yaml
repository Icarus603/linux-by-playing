id: "6-16"
title: /proc：核心的窗口
kind: practice
story: "/proc 是 Linux 核心「動態產生」的虛擬目錄，裡面其實不是真的檔案，而是核心把系統資訊當成檔案給你看：每個程序有自己的 /proc/PID，CPU 資訊在 /proc/cpuinfo，記憶體在 /proc/meminfo。讀它們，就像直接問核心問題。"
goal: "用 /proc/cpuinfo 數出這台機器有幾個 processor（CPU 核心），answer 提交數字。"
teaches: [nproc, cat, grep]
xp: 25
hints:
  - "/proc/cpuinfo 裡每個核心會有一行開頭是 processor。"
  - "打：grep -c ^processor /proc/cpuinfo（-c 是只數有幾行符合）"
  - "或更簡單：nproc 直接印出核心數。"
setup: ""
check: |
  exp=$(nproc)
  [[ "$LBP_ANSWER" == "$exp" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "數字不對。"
  exit 1
solution: |
  grep -c ^processor /proc/cpuinfo
  answer "$(nproc)"
