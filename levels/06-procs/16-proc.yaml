id: "6-16"
title: /proc：核心的窗口
kind: practice
story: "/proc 是核心動態生成的虛擬目錄，每個程序有自己的 /proc/PID，系統資訊也在裡面（cpuinfo、meminfo…）。讀它就是在直接問核心。"
goal: "用 /proc/cpuinfo 數出這台機器有幾個 processor（CPU 核心），answer 提交數字。"
teaches: [nproc, cat, grep]
xp: 25
hints:
  - "grep -c ^processor /proc/cpuinfo"
  - "nproc 也能直接告訴你。"
setup: ""
check: |
  exp=$(nproc)
  [[ "$LBP_ANSWER" == "$exp" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "數字不對。"
  exit 1
solution: |
  grep -c ^processor /proc/cpuinfo
  answer "$(nproc)"
