id: "6-01"
title: ps：誰在執行
kind: learn
story: "每個正在執行的程式，在系統眼裡都是一個「程序」（process），並且有一個獨一無二的編號 PID（process id）。\n\nps 指令列出程序。最常用的寫法是 ps aux：a 和 x 讓你看到所有人、所有程序，u 讓輸出更詳細。輸出非常長，所以常搭配 | grep 關鍵字 只留下含關鍵字的那幾行。\n站上有個叫 starlink-daemon 的常駐程式（「daemon」就是在背景一直跑的服務）。"
goal: "找出 starlink-daemon 的 PID，answer 提交那個數字。"
teaches: [ps, pgrep]
xp: 15
hints:
  - "打：ps aux | grep starlink，會列出含 starlink 的行。"
  - "輸出的第 2 欄就是 PID（第 1 欄是擁有者）。"
  - "懶人做法：pgrep -x starlink-daemon 直接印出 PID。"
setup: |
  cp -f /usr/bin/sleep /usr/local/bin/starlink-daemon
  setsid setpriv --reuid=player --regid=player --init-groups -- starlink-daemon 100000 >/dev/null 2>&1 </dev/null &
  sleep 0.3
check: |
  exp=$(pgrep -x starlink-daemon | head -1)
  [[ -n "$exp" && "$LBP_ANSWER" == "$exp" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "PID 不對，再用 ps 或 pgrep 查一次。"
  exit 1
cleanup: |
  pkill -x starlink-daemon || true
  rm -f /usr/local/bin/starlink-daemon
solution: |
  answer "$(pgrep -x starlink-daemon | head -1)"
