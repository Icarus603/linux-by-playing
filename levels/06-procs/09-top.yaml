id: "6-09"
title: 誰在吃 CPU
kind: practice
story: "引擎過熱了，有個程序把 CPU（電腦的運算大腦）吃光。怎麼找出是誰？\n  top   即時畫面，會一直更新，按 q 離開；預設最耗 CPU 的排在最上面\n  ps aux --sort=-%cpu   一次性的排行榜，--sort=-%cpu 是「依 CPU 使用率由高到低排」\n加上 | head -5 只看前五名。"
goal: "找出 CPU 使用率最高的程序名稱，answer 提交。"
teaches: [top, htop, ps]
xp: 25
hints:
  - "打：top，看最上面的那個程序，看完按 q 離開。"
  - "或打：ps aux --sort=-%cpu | head -5，第一筆（標題下面那行）就是最耗 CPU 的。"
  - "answer 它最後一欄（COMMAND）的名稱。"
setup: |
  cp -f /usr/bin/yes /usr/local/bin/cpu-hog
  setsid setpriv --reuid=player --regid=player --init-groups -- bash -c 'exec cpu-hog > /dev/null' >/dev/null 2>&1 </dev/null &
  sleep 0.5
check: |
  [[ "$LBP_ANSWER" == "cpu-hog" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "不是最吃 CPU 的那個。"
  exit 1
cleanup: |
  pkill -x cpu-hog || true
  rm -f /usr/local/bin/cpu-hog
solution: |
  ps aux --sort=-%cpu | head -3
  answer cpu-hog
reveal: "吃光 CPU 的程序 cpu-hog，行為簽章和 Warden 一模一樣。它在『練習』，為了撐住整座站。"
