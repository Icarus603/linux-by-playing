id: "6-07"
title: 暫停與繼續：Ctrl-Z、bg、fg
kind: practice
story: "前景程式可以按 Ctrl-Z 暫停（SIGTSTP），然後用 bg 讓它轉到背景繼續跑，或用 fg 拉回前景。jobs 會列出所有工作。"
goal: "執行 sleep 300，按 Ctrl-Z 暫停它，再輸入 bg 讓它在背景繼續執行。"
teaches: [bg, fg, jobs]
xp: 25
hints:
  - "先輸入 sleep 300 並按 Enter。"
  - "程式執行中按 Ctrl-Z，會回到提示字元，並顯示 Stopped。"
  - "輸入 bg。用 jobs 確認狀態是 Running。"
setup: ""
check: |
  pid=$(pgrep -u player -f '^sleep 300$' | head -1)
  [[ -n "$pid" ]] && [[ "$(ps -o stat= -p "$pid")" != T* ]] && [[ "$LBP_LAST" =~ ^bg([[:space:]]|$) ]]
cleanup: |
  pkill -u player -f '^sleep 300$' || true
solution: |
  sleep 300 &
  bg 2>/dev/null || true
