id: "6-13"
title: lsof：誰開著這個檔案
kind: practice
story: "在 Linux 裡「一切皆檔案」：連網路連線、裝置都被當成檔案。lsof（list open files）列出「程序目前開著哪些檔案」，也能反過來問：「這個檔案現在被誰開著？」\n\n用途：想刪除或卸載某個東西卻被告知「正在使用中」時，就用它抓出是哪個程序。\nledger.log 好像被某個程序一直占著。"
goal: "找出正在開啟 ledger.log 的程序 PID，answer 提交。"
teaches: [lsof]
xp: 25
hints:
  - "格式：lsof 檔案路徑"
  - "打：lsof /home/player/ledger.log"
  - "輸出的第 2 欄（PID）就是答案。"
setup: |
  cd /home/player
  echo "ledger start" > ledger.log
  chown player:player ledger.log
  cp -f /usr/bin/tail /usr/local/bin/ledger-writer
  setsid setpriv --reuid=player --regid=player --init-groups -- ledger-writer -f /home/player/ledger.log >/dev/null 2>&1 </dev/null &
  sleep 0.4
check: |
  exp=$(pgrep -x ledger-writer | head -1)
  [[ -n "$exp" && "$LBP_ANSWER" == "$exp" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "PID 不對，用 lsof 指定檔案路徑查查看。"
  exit 1
cleanup: |
  pkill -x ledger-writer || true
  rm -f /usr/local/bin/ledger-writer
solution: |
  lsof /home/player/ledger.log
  answer "$(pgrep -x ledger-writer | head -1)"
