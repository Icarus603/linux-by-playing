id: "6-10"
title: nice 與 renice
kind: practice
story: "不想殺掉吃 CPU 的程序，只想叫它「禮讓」一點？可以調整它的 nice 值：\n  nice 值範圍是 -20 到 19，數字越大，越客氣、優先權越低（越容易讓別人先用 CPU）\n  renice -n 數字 -p PID   調整「已經在跑」的程序"
goal: "把 cpu-hog 的 nice 值調到 10 以上（降低它的優先權）。"
teaches: [renice, nice]
xp: 25
hints:
  - "先拿 PID：pgrep -x cpu-hog"
  - "格式：renice -n 數字 -p PID"
  - "例如：renice -n 10 -p 剛才的PID。"
setup: |
  cp -f /usr/bin/yes /usr/local/bin/cpu-hog
  setsid setpriv --reuid=player --regid=player --init-groups -- bash -c 'exec cpu-hog > /dev/null' >/dev/null 2>&1 </dev/null &
  sleep 0.5
check: |
  pid=$(pgrep -x cpu-hog | head -1)
  [[ -n "$pid" ]] || { echo '找不到 cpu-hog 程序。'; exit 1; }
  (( $(ps -o ni= -p "$pid" | tr -d " ") >= 10 )) || { echo 'cpu-hog 的 nice 值還不夠高（至少要 10）。'; exit 1; }
cleanup: |
  pkill -x cpu-hog || true
  rm -f /usr/local/bin/cpu-hog
solution: |
  renice -n 10 -p "$(pgrep -x cpu-hog | head -1)"
