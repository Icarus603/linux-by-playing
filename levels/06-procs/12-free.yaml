id: "6-12"
title: 記憶體與負載
kind: practice
story: "幾個看系統「健康狀況」的指令：\n  free -m     看記憶體（RAM）用量，-m 表示用 MB 為單位\n  uptime      開機多久，以及系統「平均負載」（越高越忙）\n  vmstat      整體資源概況\n  watch -n 秒數 指令   每隔幾秒自動重跑一次指令，做簡單的即時監控"
goal: "用 free -m 查出這台機器的記憶體總量（MB，Mem: 那行的第一個數字），answer 提交。"
teaches: [free, uptime, vmstat]
xp: 20
hints:
  - "打：free -m"
  - "找到開頭是 Mem: 的那行。"
  - "total 那一欄（Mem: 後的第一個數字）就是總量，answer 它。"
setup: ""
check: |
  exp=$(free -m | awk '/^Mem:/{print $2}')
  [[ "$LBP_ANSWER" == "$exp" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "數字不對，要看 Mem: 那行的 total。"
  exit 1
solution: |
  free -m
  answer "$(free -m | awk '/^Mem:/{print $2}')"
