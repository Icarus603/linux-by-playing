id: "6-11"
title: 啟動時就禮讓
kind: practice
story: "上一關是調整「已經在跑」的程式。如果一開始就想讓它客氣一點，啟動時就加 nice：\n  nice -n 數字 指令\n備份、壓縮這類不趕時間的大工作很適合這樣跑，才不會拖慢其他事情。"
goal: "用 nice 把 nice 值設為 15，在背景執行 sleep 200。"
teaches: [nice]
xp: 20
hints:
  - "格式：nice -n 數字 指令"
  - "要在背景，結尾別忘了加 &。"
  - "打：nice -n 15 sleep 200 &"
setup: ""
check: |
  pid=$(pgrep -u player -f '^sleep 200$' | head -1)
  [[ -n "$pid" ]] || { echo '找不到 sleep 200 程序。'; exit 1; }
  [[ "$(ps -o ni= -p "$pid" | tr -d " ")" == "15" ]] || { echo 'sleep 200 的 nice 值還不是 15。'; exit 1; }
cleanup: |
  pkill -u player -f '^sleep 200$' || true
solution: |
  nice -n 15 sleep 200 &
