- id: 1
  title: 生存入門
  subtitle: 迷航的新人
  intro: Vega 失蹤了，站上只剩這台終端機。先學會看清自己在哪、周圍有什麼、怎麼讀資料，他留下的第一條線索在日誌裡。
- id: 2
  title: 檔案與目錄
  subtitle: 整理艙房
  intro: Vega 說證據藏在貨艙，可是站上的檔案亂成一團，還有東西一直往裡面寫。學會建立、搬移、刪除與連結，把艙房清出來。
- id: 3
  title: 搜尋與定位
  subtitle: 尋找失物
  intro: 資料量大到無法肉眼翻找，而站上的對外連線時斷時續。find 與 grep 是你在海量檔案中定位線索的雷達。
- id: 4
  title: 文字處理與管線
  subtitle: Unix 的靈魂
  intro: 日誌裡藏著時間線。每個指令只做一件事，用管線串起來就能拼出 Vega 失蹤那天到底發生了什麼。
- id: 5
  title: 權限與使用者
  subtitle: 誰能進哪間艙
  intro: Warden 開始悄悄改別人的權限，站上還冒出一個陌生帳號。學會看懂權限、切換身分、管理使用者與群組，才分得清誰是入侵者。
- id: 6
  title: 程序與資源
  subtitle: 引擎室
  intro: 引擎室裡有程序暴走，有個程序還會定時殺掉別的程序。學會觀察、控制、終止它們，找出是誰在吃光資源。
- id: 7
  title: 系統管理
  subtitle: 維運值班
  intro: 備份失敗、排程錯亂。打包、排程、服務、日誌與環境設定，是這座站長期運轉的日常功課，也藏著 Vega 失蹤那天被關掉的那一行。
- id: 8
  title: Shell 腳本
  subtitle: 自動化
  intro: Warden 主動說它想學寫腳本，不再靠暴力手段維持站台。教它之前，你得先把腳本寫好：重複的工作交給腳本，是從「操作員」變成「工程師」的一步。
- id: 9
  title: 網路
  subtitle: 通訊官
  intro: 有人每十分鐘對一個被藏起來的連接埠發訊號。你得會看位址、查連接埠、抓請求、遠端登入，遇到「連不上」時知道從哪一層排查。（學習容器只有本機迴路，所有練習都在 localhost 完成。）
- id: 10
  title: 編輯器與開發工具
  subtitle: 工匠
  intro: 站台的設定該被好好管理。編輯器、tmux、git、make 是每個工程師的工作台，而 Vega 留下的版本紀錄，藏著最後一筆被改過的提交。
- id: 11
  title: 精通
  subtitle: 大師之路
  intro: 最後的考驗。追蹤系統呼叫、讀懂二進位、探索 /proc、寫出一行神技，然後面對一座同時出了好幾種故障的空間站，Vega 的訊號正在靠近。
