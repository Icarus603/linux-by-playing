- id: 1
  title: 生存入門
  subtitle: 迷航的新人
  intro: 你剛接手 Kernel-7 號空間站的終端機。先學會看清自己在哪、周圍有什麼、怎麼讀資料。
- id: 2
  title: 檔案與目錄
  subtitle: 整理艙房
  intro: 站上的檔案亂成一團。學會建立、複製、搬移、刪除與連結，把艙房整理乾淨。
- id: 3
  title: 搜尋與定位
  subtitle: 尋找失物
  intro: 資料量大到無法肉眼翻找。find 與 grep 是你在海量檔案中定位目標的雷達。
- id: 4
  title: 文字處理與管線
  subtitle: Unix 的靈魂
  intro: 每個指令只做一件事，用管線串起來就能解決複雜問題。這是 Linux 最強大的思維。
- id: 5
  title: 權限與使用者
  subtitle: 誰能進哪間艙
  intro: Linux 是多人系統。學會看懂權限、切換身分、管理使用者與群組，才能把門鎖得剛剛好。
- id: 6
  title: 程序與資源
  subtitle: 引擎室
  intro: 每個執行中的程式都是一個程序。學會觀察、控制、終止它們，並找出誰在吃光資源。
- id: 7
  title: 系統管理
  subtitle: 維運值班
  intro: 打包備份、排程、服務、日誌與環境設定。這些是讓一台伺服器長期穩定運轉的日常功課。
- id: 8
  title: Shell 腳本
  subtitle: 自動化
  intro: 後日談。Warden 想學會自己寫腳本，不再事事問你。把重複的工作寫成腳本，是從「操作員」變成「工程師」的關鍵一步。
- id: 9
  title: 網路
  subtitle: 通訊官
  intro: Kernel-7 要接上星網。你得會看位址、查連接埠、抓請求、遠端登入，而且遇到「連不上」時知道從哪一層開始排查。（學習容器只有本機迴路，所有練習都在 localhost 完成。）
- id: 10
  title: 編輯器與開發工具
  subtitle: 工匠
  intro: 站台的設定該被好好管理。編輯器、tmux、git、make 是每個工程師的工作台，Vega 留下的版本紀錄裡藏著最後的線索。
- id: 11
  title: 精通
  subtitle: 大師之路
  intro: 最後的考驗。追蹤系統呼叫、讀懂二進位、探索 /proc、寫出一行神技，然後面對一座同時出了好幾種故障的空間站。
