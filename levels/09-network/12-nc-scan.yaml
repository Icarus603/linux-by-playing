id: "9-12"
title: 連接埠掃描
kind: practice
story: "「這個服務到底有沒有起來？」可以直接去敲門試試。nc -z 只檢查埠有沒有開，不送任何資料（z = zero-I/O，只探測）；-v 會把結果寫出來。後面可以接一個範圍：\n  nc -zv 127.0.0.1 9200-9210\n每個埠一行結果，開著的會寫 succeeded（成功），關著的是 refused（被拒絕）。"
goal: "9200 到 9210 之間有一個連接埠開著。找出來，answer 提交埠號。"
teaches: [nc]
xp: 35
hints:
  - "打：nc -zv 127.0.0.1 9200-9210"
  - "輸出每個埠一行，找那行有 succeeded 的。"
  - "輸出可能走 stderr，過濾要先合併：nc -zv 127.0.0.1 9200-9210 2>&1 | grep succeeded"
setup: |
  p=$((RANDOM % 11 + 9200))
  mkdir -p /var/lib/lbp && echo "$p" > /var/lib/lbp/answer && chmod 600 /var/lib/lbp/answer
  setsid setpriv --reuid=player --regid=player --init-groups -- python3 -c 'import socket,time,sys; s=socket.socket(); s.setsockopt(1,2,1); s.bind(("127.0.0.1",int(sys.argv[1]))); s.listen(); time.sleep(10**6)' "$p" >/dev/null 2>&1 </dev/null &
  sleep 0.6
check: |
  [[ -s /var/lib/lbp/answer && "$LBP_ANSWER" == "$(cat /var/lib/lbp/answer)" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "埠號不對。"
  exit 1
cleanup: |
  pkill -f '[s]ocket.socket' 2>/dev/null || true
solution: |
  nc -zv 127.0.0.1 9200-9210 2>&1 | grep succeeded
  answer "$(nc -z 127.0.0.1 9200-9210 -v 2>&1 | grep succeeded | grep -oE '92[0-9]{2}' | head -1)"
