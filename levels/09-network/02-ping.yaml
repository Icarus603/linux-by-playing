id: "9-02"
title: ping：通不通
kind: learn
story: "ping 對目標送出 ICMP 封包，看對方有沒有回應。-c 次數 限制送幾個（不加會一直 ping 到你按 Ctrl-C）。網路排錯的第一步通常就是 ping。"
goal: "對 127.0.0.1 送出 3 個 ping，數一數收到幾個回應，answer 提交那個數字。"
teaches: [ping]
xp: 15
hints:
  - "ping -c 3 127.0.0.1"
  - "輸出結尾的統計有 received。"
setup: ""
check: |
  [[ "$LBP_ANSWER" == "3" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "不對，看結尾那行統計裡的 received。"
  exit 1
solution: |
  ping -c 3 127.0.0.1
  answer 3
