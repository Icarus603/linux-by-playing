id: "9-15"
title: 移除錯誤的規則
kind: practice
story: "規則設錯了怎麼辦？-D 依內容刪除、或 -D 鏈 編號 依序號刪除（iptables -L --line-numbers 看序號）。-F 清空整條鏈，但那會連正確的規則一起殺掉，要小心。"
goal: "有人誤封了 9400 埠，但 9401 是刻意封鎖的。只刪掉 9400 的規則，讓 9400 恢復可連，同時 9401 仍被封鎖。"
teaches: [iptables]
xp: 55
hints:
  - "sudo iptables -S"
  - "sudo iptables -D INPUT -p tcp --dport 9400 -j REJECT"
  - "不要用 -F，那會把 9401 的規則也清掉。"
setup: |
  iptables -F INPUT
  for p in 9400 9401; do
    setsid setpriv --reuid=player --regid=player --init-groups -- python3 -c 'import socket,time,sys; s=socket.socket(); s.setsockopt(1,2,1); s.bind(("127.0.0.1",int(sys.argv[1]))); s.listen(); time.sleep(10**6)' "$p" >/dev/null 2>&1 </dev/null &
  done
  iptables -A INPUT -p tcp --dport 9400 -j REJECT
  iptables -A INPUT -p tcp --dport 9401 -j DROP
  sleep 0.7
check: |
  nc -z -w1 127.0.0.1 9400 || { echo "9400 還是連不上。"; exit 1; }
  ! nc -z -w1 127.0.0.1 9401 || { echo "9401 本來就該被封鎖，別刪錯了。用 restart 重來。"; exit 1; }
cleanup: |
  iptables -F INPUT
  pkill -f '[s]ocket.socket' 2>/dev/null || true
solution: |
  sudo iptables -D INPUT -p tcp --dport 9400 -j REJECT
