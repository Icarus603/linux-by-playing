id: "9-07"
title: curl 送出資料（POST）
kind: practice
story: "網站和 API 不只能「讀」，也能「寫」：提交表單、回報資料。HTTP 用「方法」區分：\n  GET   讀取（curl 預設）\n  POST  送出資料\ncurl -d '資料' 網址 會用 POST 把資料送出去（只要出現 -d，curl 就自動改用 POST）。資料常寫成 名稱=值。\n本機 8081 有個接收站台回報的 API。"
goal: "向 http://127.0.0.1:8081/report 以 POST 送出資料 status=ok。"
teaches: [curl]
xp: 35
hints:
  - "格式：curl -d '資料' 網址"
  - "資料是 status=ok。"
  - "打：curl -d 'status=ok' http://127.0.0.1:8081/report，回應會告訴你有沒有收到。"
setup: |
  mkdir -p /srv/api /usr/local/lib/lbp
  chown player:player /srv/api; rm -f /srv/api/inbox.txt
  cat > /usr/local/lib/lbp/api.py <<'PY'
  import http.server
  class H(http.server.BaseHTTPRequestHandler):
      def do_POST(self):
          n = int(self.headers.get("Content-Length", 0))
          body = self.rfile.read(n).decode()
          with open("/srv/api/inbox.txt", "a") as f:
              f.write(body + "\n")
          self.send_response(200); self.end_headers(); self.wfile.write(b"received\n")
      def do_GET(self):
          if self.path == "/vault":
              key = open("/home/player/key.txt").read().strip() if False else open("/srv/api/key").read().strip()
              if self.headers.get("X-Key") == key:
                  self.send_response(200); self.end_headers(); self.wfile.write(open("/srv/api/secret").read().encode())
              else:
                  self.send_response(401); self.end_headers(); self.wfile.write(b"unauthorized\n")
          else:
              self.send_response(404); self.end_headers()
      def log_message(self, *a): pass
  http.server.HTTPServer(("127.0.0.1", 8081), H).serve_forever()
  PY
  setsid setpriv --reuid=player --regid=player --init-groups -- python3 /usr/local/lib/lbp/api.py >/dev/null 2>&1 </dev/null &
  sleep 0.7
check: |
  grep -qx 'status=ok' /srv/api/inbox.txt 2>/dev/null
cleanup: |
  pkill -f '[a]pi.py' 2>/dev/null || true
  rm -rf /srv/api /usr/local/lib/lbp/api.py
solution: |
  curl -s -d 'status=ok' http://127.0.0.1:8081/report
