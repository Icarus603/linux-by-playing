id: "9-14"
title: iptables：防火牆規則
kind: practice
story: "防火牆像大樓的警衛，決定哪些封包能進來。Linux 的防火牆工具 iptables 依「鏈」裡的規則一條條比對封包，INPUT 鏈管「進來的」封包。規則依序比對，先符合的先生效。\n  sudo iptables -S                列出所有規則\n  sudo iptables -A INPUT -p tcp --dport 9300 -j DROP\n    -A INPUT   追加一條規則到 INPUT 鏈（Append）\n    -p tcp     協定是 TCP\n    --dport 9300   目的埠是 9300\n    -j DROP    動作：直接丟掉（也可以是 ACCEPT 放行、REJECT 拒絕並回覆）"
goal: "9300 與 9301 兩個埠都有服務在聽。只封鎖 9300（丟棄進來的 TCP 封包），9301 要保持可連。"
teaches: [iptables]
xp: 50
hints:
  - "先看目前規則：sudo iptables -S"
  - "要封鎖的是 9300 這個目的埠，動作用 DROP。"
  - "打：sudo iptables -A INPUT -p tcp --dport 9300 -j DROP，再用 nc -zv 試 9300 和 9301。"
setup: |
  iptables -F INPUT
  for p in 9300 9301; do
    setsid setpriv --reuid=player --regid=player --init-groups -- python3 -c 'import socket,time,sys; s=socket.socket(); s.setsockopt(1,2,1); s.bind(("127.0.0.1",int(sys.argv[1]))); s.listen(); time.sleep(10**6)' "$p" >/dev/null 2>&1 </dev/null &
  done
  sleep 0.7
check: |
  nc -z -w1 127.0.0.1 9301 || { echo "9301 不該被擋。"; exit 1; }
  ! nc -z -w1 127.0.0.1 9300
cleanup: |
  iptables -F INPUT
  pkill -f '[s]ocket.socket' 2>/dev/null || true
solution: |
  sudo iptables -A INPUT -p tcp --dport 9300 -j DROP
