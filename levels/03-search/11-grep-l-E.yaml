id: "3-11"
title: grep -l 與 -E
kind: practice
story: "這一關用到兩個新東西：\n\n① -l（小寫 L）：不印出符合的內容，只印出「有符合的檔案名字」。搭配 -r 就是「哪些檔案裡有這個詞」。\n\n② 「正規表示式」：一種描述文字「樣子」的寫法。你想找 IP 位址，但不知道它確切是什麼，只知道開頭是 192.168.，後面還有兩組數字。\n   . 在這裡是「任意一個字元」，要真的比對「點」得寫成 \\.\n   [0-9] 是「一個數字」，後面加 + 表示「一個或更多個」\n   所以 192\\.168\\.[0-9]+\\.[0-9]+ 就是「192.168. 加兩組數字」。用這種寫法要加 -E，並用單引號包住。\n\n（偷懶版：只找開頭 grep -rl '192.168' leak 在這裡也能過。）"
goal: "在 leak 目錄中，找出含有 192.168. 開頭 IP 位址的檔案，answer 提交檔名。"
teaches: [grep]
xp: 25
hints:
  - "要搜整個目錄用 -r，只要檔名用 -l，所以選項合起來是 -rl。"
  - "簡單版：grep -rl '192.168' leak"
  - "進階版（正規表示式）：grep -rlE '192\\.168\\.[0-9]+\\.[0-9]+' leak　然後 answer 印出的檔名（b.txt）。"
setup: |
  cd /home/player
  mkdir -p leak
  echo "server at 10.0.0.5" > leak/a.txt
  echo "gateway 192.168.1.254 is up" > leak/b.txt
  echo "no address" > leak/c.txt
check: |
  [[ "$LBP_ANSWER" == "b.txt" || "$LBP_ANSWER" == "leak/b.txt" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "不是那個檔案。"
  exit 1
solution: |
  grep -rlE '192\.168\.[0-9]+\.[0-9]+' leak
  answer b.txt
