id: "3-02"
title: 不分大小寫
kind: practice
story: "Linux 區分大小寫：README、Readme、readme 是三個不同的檔案。如果不確定大小寫，把 -name 換成 -iname（i = ignore，忽略），它就不管大小寫了。\n\n另外，要數有幾個結果，可以在後面接 | wc -l（| 是把前面的輸出交給後面處理，wc -l 數行數，每個結果一行，行數就是數量）。"
goal: "在 docs 底下，找出所有名字是 readme（不分大小寫、沒有副檔名）的檔案，answer 提交總共有幾個。"
teaches: [find]
xp: 15
hints:
  - "把 -name 換成 -iname：find docs -iname readme"
  - "數量：在後面加 | wc -l，就會得到一個數字。"
  - "打：find docs -iname readme | wc -l，然後 answer 那個數字。"
setup: |
  cd /home/player
  mkdir -p docs/{a,b,c,d}
  touch docs/a/README docs/b/readme docs/c/ReadMe docs/d/README.md docs/d/readme.txt docs/a/notes
check: |
  [[ "$LBP_ANSWER" == "3" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "數量不對。注意：README.md 的名字不是單純的 readme。"
  exit 1
solution: |
  find docs -iname readme | wc -l
  answer 3
