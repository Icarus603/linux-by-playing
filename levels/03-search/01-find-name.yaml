id: "3-01"
title: find：用名字找
kind: learn
story: "站上有幾千個檔案，不可能一個個翻。find 會從你指定的目錄開始，一層層往下找，直到找到符合條件的東西。\n\n最基本的條件是檔名：find 起點目錄 -name 檔名\n意思是：「從這個目錄開始，找名字是這個的檔案」，找到就印出它的完整位置。"
goal: "在 ship 目錄底下找出 radar.cfg 在哪，answer 提交它印出來的路徑。"
teaches: [find]
xp: 15
hints:
  - "格式：find 從哪裡找 -name 要找的檔名"
  - "打：find ship -name radar.cfg"
  - "它會印出一行路徑，把那整行 answer 出來。"
setup: |
  cd /home/player
  mkdir -p ship/deck-{1,2,3,4}/{nav,comms,engine}
  echo cfg > ship/deck-3/nav/radar.cfg
  for d in ship/deck-*/comms; do echo x > $d/radio.cfg; done
check: |
  [[ "$LBP_ANSWER" == *ship/deck-3/nav/radar.cfg ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "路徑不對，用 find 的輸出直接複製。"
  exit 1
solution: |
  find ship -name radar.cfg
  answer ship/deck-3/nav/radar.cfg
