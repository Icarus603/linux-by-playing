id: "3-06"
title: find 配 -exec
kind: practice
story: "-exec 讓 find 對「每一個找到的結果」執行一個指令。寫法：\n  find 起點 條件 -exec 指令 {} \\;\n其中 {} 會被換成每個找到的檔名，\\; 表示指令到此結束（分號前的反斜線是為了不讓 shell 誤解）。\n\n例如 -exec chmod +x {} \\; 就是對每個找到的檔案執行 chmod +x（chmod +x 是「讓檔案可以被執行」，之後第 5 階段會細講）。"
goal: "scripts 底下所有 .sh 檔都還不能執行。用 find 配 -exec chmod +x 一次全部加上。"
teaches: [find, chmod]
xp: 25
hints:
  - "先用 find scripts -name '*.sh' 確認會找到哪些檔案（'*.sh' 要用單引號包起來）。"
  - "再接上：-exec chmod +x {} \\;"
  - "完整：find scripts -name '*.sh' -exec chmod +x {} \\;"
setup: |
  cd /home/player
  mkdir -p scripts/sub
  for f in scripts/a.sh scripts/b.sh scripts/sub/c.sh; do echo '#!/bin/bash' > $f; chmod 644 $f; done
  echo note > scripts/readme.txt
check: |
  cd /home/player/scripts
  [[ "$LBP_LAST" == *find* && "$LBP_LAST" != *-name* ]] && { echo "find 的檔名條件前面要加 -name，例如 -name '*.sh'；沒有 -name，'*.sh' 會被當成要搜尋的起點路徑。"; exit 1; }
  [[ -x readme.txt ]] && { echo "readme.txt 不該有執行權限，只該處理 .sh 檔。用 /restart 重來。"; exit 1; }
  [[ -x a.sh && -x b.sh ]] || { echo "a.sh 或 b.sh 還不能執行。"; exit 1; }
  [[ -x sub/c.sh ]] || { echo "sub/ 裡的 c.sh 還沒處理。find 要自己往下找，不要讓 shell 的 *.sh 先展開。"; exit 1; }
solution: |
  find scripts -name '*.sh' -exec chmod +x {} \;
