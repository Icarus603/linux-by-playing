id: "3-12"
title: 上下文：-A -B -C
kind: practice
story: "光看到出錯那一行常常不夠，原因通常寫在它附近的行。grep 可以連「周圍的行」一起印：\n  -A 數字   After：多印出符合行「後面」幾行\n  -B 數字   Before：多印出「前面」幾行\n  -C 數字   Context：前後都印\n例如 grep -A 1 CRITICAL 檔 就是找到 CRITICAL 那行，再多印它的下一行。"
goal: "reactor.log 裡有一行 CRITICAL，它的「下一行」寫著 cause=某原因。用 grep -A 找出原因，answer 提交 cause= 後面的值。"
teaches: [grep]
xp: 25
hints:
  - "要看符合行的「下一行」，用 -A 1。"
  - "打：grep -A 1 CRITICAL reactor.log"
  - "在輸出的第二行找 cause=，answer 它後面的值。"
setup: |
  cd /home/player
  { for i in $(seq 1 100); do echo "ok $i"; done; echo "CRITICAL: reactor temp 9000"; echo "cause=coolant-leak"; for i in $(seq 1 100); do echo "ok $i"; done; } > reactor.log
check: |
  [[ "$LBP_ANSWER" == "coolant-leak" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "原因不對，要看 CRITICAL 的下一行。"
  exit 1
solution: |
  grep -A 1 CRITICAL reactor.log
  answer coolant-leak
reveal: "反應爐過熱是冷卻液外洩造成的。但外洩前一分鐘，有人下過一道降低流量的指令。"
