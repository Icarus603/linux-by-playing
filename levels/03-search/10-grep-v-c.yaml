id: "3-10"
title: grep -v 與 -c
kind: practice
story: "兩個很好用的選項：\n  -v   反過來：印出「不含」關鍵字的行（v = invert，反轉）\n  -c   不印內容，只告訴你「符合的行有幾行」（c = count）\n\n設定檔裡以 # 開頭的行是註解（寫給人看的說明，不會生效）。'^#' 是個小規則，意思是「以 # 開頭」（^ 代表行首）。所以 grep -v '^#' 就是「排除註解」。"
goal: "app.conf 裡以 # 開頭的是註解。算出「非註解」的行數，answer 提交。"
teaches: [grep]
xp: 20
hints:
  - "先看哪些會被留下：grep -v '^#' app.conf（-v 排除以 # 開頭的行）。"
  - "想直接得到數字，再加上 -c。"
  - "打：grep -vc '^#' app.conf，answer 那個數字。"
setup: |
  cd /home/player
  { for i in $(seq 1 14); do echo "# comment $i"; done; for i in $(seq 1 7); do echo "setting$i=value"; done; } > app.conf
check: |
  [[ "$LBP_ANSWER" == "7" ]] && exit 0
  [[ -n "$LBP_ANSWER" ]] && echo "數量不對，註解行要排除。"
  exit 1
solution: |
  grep -vc '^#' app.conf
  answer 7
