id: "3-05"
title: 依時間找並刪除
kind: practice
story: "-mtime 依「最後修改是幾天前」篩選：\n  -mtime +30   超過 30 天前修改的（舊檔）\n  -mtime -3    3 天內修改的（新檔）\n再配上 -delete 就能把符合條件的檔案直接刪掉，是自動清理過期檔案的利器。\n\n警告：-delete 一定要寫在最後面，而且一刪就沒了。新手請先不加 -delete 預覽清單，確認沒錯再加。"
goal: "刪除 tmp 底下超過 30 天沒修改的檔案，近期的檔案要保留。"
teaches: [find]
xp: 25
hints:
  - "先預覽（不刪）：find tmp -type f -mtime +30，看清單是不是你要刪的。"
  - "確認清單沒問題，再把同一行最後加上 -delete。"
  - "打：find tmp -type f -mtime +30 -delete"
setup: |
  cd /home/player
  mkdir -p tmp
  for n in a b c; do echo old > tmp/old-$n.log; touch -d '60 days ago' tmp/old-$n.log; done
  for n in x y; do echo new > tmp/new-$n.log; done
check: |
  cd /home/player/tmp
  [[ $(ls old-* 2>/dev/null | wc -l) -eq 0 && $(ls new-* 2>/dev/null | wc -l) -eq 2 ]]
solution: |
  find tmp -type f -mtime +30 -delete
